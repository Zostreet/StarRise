</style></head><body><header class="top"><div class="top-inner"><a class="brand" href="index.html">⭐ StarRise Admin</a><nav class="links"><a href="founding-creator-admin.html">Review Center</a><a href="founding-creator-scorecards.html">Scorecards</a><a href="founding-creator-rankings.html">Rankings</a></nav></div></header><main><div class="eyebrow">Private applicant workflow</div><h1>Interview Center</h1><p class="lead">Schedule interviews, send invitations, track outcomes, and save private notes.</p><div id="auth" class="status">Verifying administrator access…</div><section id="area" class="hidden"><div class="toolbar"><input id="search" type="search" placeholder="Search applicant, role, discipline or city…"><select id="filter"><option value="all">All applicants</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="no_show">No-show</option><option value="cancelled">Cancelled</option><option value="unscheduled">Not scheduled</option></select></div><div id="list" class="list"></div></section></main><script>
const db=window.supabase.createClient("https://rcnikxotdalxtuvpmlvm.supabase.co","sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN"),auth=document.getElementById("auth"),area=document.getElementById("area"),list=document.getElementById("list"),search=document.getElementById("search"),filter=document.getElementById("filter");let user,apps=[],interviews={};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const localValue=v=>{if(!v)return"";const d=new Date(v),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())};const options=(v,items)=>items.map(([x,t])=>`<option value="${x}" ${v===x?"selected":""}>${t}</option>`).join("");
function render(){const term=search.value.trim().toLowerCase(),f=filter.value,shown=apps.filter(a=>{const i=interviews[a.id];return(f==="all"||(f==="unscheduled"?!i:i?.status===f))&&[a.legal_name,a.stage_or_business_name,a.applicant_role,a.genre_or_discipline,a.city].join(" ").toLowerCase().includes(term)});if(!shown.length){list.innerHTML='<div class="empty">No applicants match this view.</div>';return}list.innerHTML=shown.map(a=>{const i=interviews[a.id]||{};return `<article class="card" data-app="${a.id}" data-id="${i.id||""}"><div class="head"><div><h2>${esc(a.stage_or_business_name||a.legal_name)}</h2><div class="meta">${esc(a.legal_name)} · ${esc(a.applicant_role)} · ${esc(a.genre_or_discipline)} · ${esc(a.city)}</div></div><span class="badge">${esc(i.status||"Not scheduled")}</span></div><div class="body"><div class="form"><div class="field"><label>Date and time</label><input data-field="starts_at" type="datetime-local" value="${localValue(i.starts_at)}"></div><div class="field"><label>Duration</label><select data-field="duration_minutes">${options(String(i.duration_minutes||30),[["15","15 minutes"],["30","30 minutes"],["45","45 minutes"],["60","60 minutes"],["90","90 minutes"]])}</select></div><div class="field"><label>Format</label><select data-field="interview_format">${options(i.interview_format||"video",[["video","Video"],["phone","Phone"],["in_person","In person"]])}</select></div><div class="field wide"><label>Meeting link, phone, or location</label><input data-field="location_or_link" maxlength="1000" value="${esc(i.location_or_link||"")}" placeholder="https://... or meeting location"></div><div class="field"><label>Status</label><select data-field="status">${options(i.status||"scheduled",[["scheduled","Scheduled"],["completed","Completed"],["no_show","No-show"],["cancelled","Cancelled"]])}</select></div><div class="field wide"><label>Private interview notes</label><textarea data-field="private_notes" maxlength="4000">${esc(i.private_notes||"")}</textarea></div></div><div class="actions"><button class="button save" type="button">Save Interview</button><button class="button secondary send" type="button" ${i.id&&i.status==="scheduled"?"":"disabled"}>Send Invitation Email</button><span class="message"></span>${i.invitation_emailed_at?'<span class="emailed">Invitation sent '+new Date(i.invitation_emailed_at).toLocaleString()+'</span>':""}</div></div></article>`}).join("")}
async function load(){const[a,i]=await Promise.all([db.from("founding_creator_applications").select("id,legal_name,stage_or_business_name,applicant_role,genre_or_discipline,city,status").neq("status","declined").order("created_at",{ascending:false}),db.from("founding_creator_interviews").select("*").order("created_at",{ascending:false})]);if(a.error||i.error){auth.textContent="Interview records could not be loaded.";auth.className="status bad";return}apps=a.data||[];interviews={};for(const x of i.data||[])if(!interviews[x.application_id])interviews[x.application_id]=x;render()}
function values(card){const get=f=>card.querySelector('[data-field="'+f+'"]').value;return{application_id:card.dataset.app,starts_at:new Date(get("starts_at")).toISOString(),duration_minutes:Number(get("duration_minutes")),interview_format:get("interview_format"),location_or_link:get("location_or_link").trim()||null,status:get("status"),private_notes:get("private_notes").trim()||null,created_by:user.id,updated_at:new Date().toISOString()}}
list.addEventListener("click",async e=>{const card=e.target.closest(".card");if(!card)return;const msg=card.querySelector(".message");if(e.target.classList.contains("save")){const start=card.querySelector('[data-field="starts_at"]');if(!start.value){msg.textContent="Choose an interview date and time.";msg.style.color="#9d2639";return}e.target.disabled=true;let q;const record=values(card);if(card.dataset.id)q=db.from("founding_creator_interviews").update(record).eq("id",card.dataset.id).select().single();else q=db.from("founding_creator_interviews").insert(record).select().single();const{data,error}=await q;if(error){msg.textContent=error.message;msg.style.color="#9d2639"}else{interviews[card.dataset.app]=data;msg.textContent="Interview saved.";msg.style.color="#176b45";render()}e.target.disabled=false}if(e.target.classList.contains("send")){e.target.disabled=true;msg.textContent="Sending…";const{error}=await db.functions.invoke("notify-founding-creator-interview",{body:{interview_id:card.dataset.id}});if(error){msg.textContent="Invitation could not be sent: "+error.message;msg.style.color="#9d2639";e.target.disabled=false}else{msg.textContent="Invitation email sent.";msg.style.color="#176b45";await load()}}});
(async()=>{const{data:{session}}=await db.auth.getSession();if(!session){location.href="login.html?redirect=founding-creator-interviews.html";return}user=session.user;const{data:admin}=await db.from("platform_admins").select("access_level").eq("user_id",user.id).maybeSingle();if(!admin){auth.textContent="Access denied. This page is limited to StarRise administrators.";auth.className="status bad";return}auth.textContent="Administrator access confirmed: "+admin.access_level+".";auth.className="status good";area.classList.remove("hidden");await load()})();search.addEventListener("input",render);filter.addEventListener("change",render);
</script></body></html>
