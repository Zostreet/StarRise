<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarRise Community</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090916;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#151526;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
a{color:#c6b2ff}
main{max-width:850px;margin:auto;padding:20px}
h1{font-size:40px}
.card{background:#19192b;border:1px solid #383850;border-radius:18px;padding:20px;margin:18px 0;min-width:0;overflow-wrap:anywhere}
input,textarea,select{display:block;width:100%;padding:12px;margin:12px 0;background:#101020;color:white;border:1px solid #555;border-radius:10px}
textarea{min-height:90px}
button{background:#a98bff;border:0;border-radius:25px;padding:12px 20px;font-weight:bold;cursor:pointer;margin:5px}
button:disabled{opacity:.5}
video,img,audio{width:100%;max-height:550px;object-fit:contain;margin:12px 0}
.error{color:#ff9999}
.success{color:#99ffbb}
.muted{color:#aaa}
.picker{display:flex;flex-wrap:wrap;gap:4px}
#selectedInfo,#status{overflow-wrap:anywhere}
#selectedInfo{margin:12px 0;line-height:1.5}
.post-actions{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.post-actions button{margin:0}
.post-meta{font-size:14px;color:#bbb}
.post-caption,.comment-body{white-space:pre-wrap;overflow-wrap:anywhere}
.post-feedback{font-size:14px}
button[aria-pressed="true"]{background:#d7c5ff}
.comments{margin-top:16px;border-top:1px solid #383850;padding-top:12px}
.comments summary{cursor:pointer;font-weight:bold;padding:8px 0}
.comment-list{list-style:none;padding:0;margin:12px 0}
.comment-list li{padding:12px 0;border-bottom:1px solid #383850}
.comment-list p{margin:6px 0}
.comment-form textarea{min-height:70px}
input[type="file"]{min-width:0;max-width:100%}
nav{display:flex;flex-wrap:wrap;gap:12px}
@media(max-width:480px){main{padding:12px}.card{padding:14px}h1{font-size:32px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<strong>⭐ StarRise</strong>
<nav>
<a href="index.html">Home</a>
<a href="members.html">Members</a>
<a href="marketplace.html">Store</a>
<a href="dashboard.html">Dashboard</a>
</nav>
</header>

<main>
<h1>Show Your Talent.</h1>
<p>Share your music, videos and photos with the world.</p>

<section id="composer" class="card" hidden>
<h2>Share Your Talent</h2>
<form id="postForm">
<div class="picker">
<button type="button" data-picker="videoFile">Choose Video</button>
<button type="button" data-picker="audioFile">Choose Song</button>
<button type="button" data-picker="imageFile">Choose Photo</button>
</div>
<input id="videoFile" type="file" accept="video/*" hidden>
<input id="audioFile" type="file" accept="audio/*" hidden>
<input id="imageFile" type="file" accept="image/*" hidden>
<label for="mediaFile">Or browse files on your phone</label>
<input id="mediaFile" type="file">
<p id="selectedInfo" class="muted" role="status" aria-live="polite">No file selected.</p>
<div id="preview"></div>

<textarea id="caption" maxlength="2200"
          placeholder="Tell us about your talent"></textarea>

<label>Visibility</label>
<select id="visibility">
<option value="public">Everyone</option>
<option value="members">Members</option>
<option value="followers">Followers</option>
<option value="private">Only Me</option>
</select>

<button id="publish" type="submit" disabled>Publish Talent Post</button>
</form>
</section>

<section id="guest" class="card" hidden>
<p>Sign in to share your talent.</p>
<a href="login.html">Sign In</a>
</section>

<div id="status" class="card" role="status" aria-live="polite">Loading Community...</div>
<p id="allPosts" hidden><a href="community.html">View all community posts</a></p>
<button id="refresh">Refresh Feed</button>
<div id="feed"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script>
<script>
(async function(){
"use strict";

const SUPABASE_URL="https://rcnikxotdalxtuvpmlvm.supabase.co";
const SUPABASE_KEY="sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN";
const BUCKET="talent-posts";

const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let user=null;
let profiles=new Map();
let previewUrl="";
let pendingPost=null;
let selectedFile=null;
let selectionReady=false;
let selectionVersion=0;
let publishing=false;
let feedVersion=0;
const pickerIds=["mediaFile","videoFile","audioFile","imageFile"];

function status(message,type=""){
 $("status").textContent=message;
 $("status").className="card "+type;
 if(publishing&&selectedFile)selection(message,type||"muted");
}

function errorText(e){
 return e?.message||String(e);
}

function fileInfo(file){
 if(!file)throw Error("Choose a file.");

 let extension=(file.name||"").split(".").pop().toLowerCase();
 const fromMime={
  "image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif",
  "audio/mpeg":"mp3","audio/wav":"wav","audio/x-wav":"wav",
  "audio/mp4":"m4a","audio/x-m4a":"m4a","audio/aac":"aac",
  "audio/ogg":"ogg","audio/flac":"flac","audio/x-flac":"flac",
  "video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov",
  "video/x-m4v":"m4v","video/3gpp":"3gp"
 };
 const images=["jpg","jpeg","png","webp","gif"];
 const audio=["mp3","wav","m4a","aac","ogg","flac"];
 const video=["mp4","webm","mov","m4v","3gp"];

 let kind;
 if(images.includes(extension))kind="image";
 else if(audio.includes(extension))kind="audio";
 else if(video.includes(extension))kind="video";
 else{
  extension=fromMime[(file.type||"").toLowerCase()];
  if(images.includes(extension))kind="image";
  else if(audio.includes(extension))kind="audio";
  else if(video.includes(extension))kind="video";
  else throw Error("Choose a supported photo, song or video file.");
 }

 const max=kind==="image"?15:kind==="audio"?100:null;

 if(!file.size){
  throw Error("That file is empty. Choose another file.");
 }

 if(max!==null&&file.size>max*1048576){
  throw Error("File exceeds "+max+" MB.");
 }

 const types={
  jpg:"image/jpeg",
  jpeg:"image/jpeg",
  png:"image/png",
  webp:"image/webp",
  gif:"image/gif",
  mp3:"audio/mpeg",
  m4a:"audio/mp4",
  wav:"audio/wav",
  aac:"audio/aac",
  ogg:"audio/ogg",
  flac:"audio/flac",
  mp4:"video/mp4",
  mov:"video/quicktime",
  m4v:"video/x-m4v",
  webm:"video/webm",
  "3gp":"video/3gpp"
 };

 return {
  kind,
  extension,
  mime:types[extension]||file.type||"application/octet-stream"
 };
}

function selection(message,type="muted"){
 $("selectedInfo").textContent=message;
 $("selectedInfo").className=type;
}

function clearPreview(){
 $("preview").replaceChildren();
 if(previewUrl)URL.revokeObjectURL(previewUrl);
 previewUrl="";
}

async function readChunk(blob){
 let bytes;
 try{
  bytes=await new Promise((resolve,reject)=>{
   const reader=new FileReader();
   const timer=setTimeout(()=>{
    reader.abort();
    reject(Error("File read timed out."));
   },25000);
   function finish(error,value){
    clearTimeout(timer);
    error?reject(error):resolve(value);
   }
   reader.onload=()=>finish(null,reader.result);
   reader.onerror=()=>finish(reader.error||Error("File read failed."));
   reader.onabort=()=>finish(Error("File read stopped."));
   try{reader.readAsArrayBuffer(blob);}catch(e){finish(e);}
  });
 }catch(e){
  if(typeof blob.arrayBuffer!=="function")throw Error(
   "Your phone could not read this file. Save it to Downloads, then use Browse Files to select that copy."
  );
  bytes=await new Promise((resolve,reject)=>{
   const timer=setTimeout(()=>reject(Error("File read timed out.")),25000);
   Promise.resolve().then(()=>blob.arrayBuffer()).then(
    value=>{clearTimeout(timer);resolve(value);},
    error=>{clearTimeout(timer);reject(error);}
   );
  }).catch(()=>{throw Error(
   "Your phone could not read this file. Save it to Downloads, then use Browse Files to select that copy."
  );});
 }
 if(!bytes||bytes.byteLength!==blob.size)throw Error("The file could not be read completely. Select it again using Browse Files.");
 return bytes;
}

async function selectFile(file){
 if(publishing)return;
 if(!file){
  if(!selectedFile)selection("No file was selected. Choose Video or Browse Files, then confirm your choice in the phone's picker.");
  return;
 }
 const version=++selectionVersion;
 selectedFile=file;
 selectionReady=false;
 pendingPost=null;
 clearPreview();
 $("publish").disabled=true;
 const label=(file.name||"Selected file")+" ("+(file.size/1048576).toFixed(1)+" MB)";
 selection("Selected: "+label+". Checking file...");
 try{
  const info=fileInfo(file);
  await readChunk(file.slice(0,Math.min(file.size,65536),info.mime));
  if(version!==selectionVersion)return;
  selectionReady=true;
  $("publish").disabled=false;
  selection("Ready: "+label,"success");
  status("Ready to publish.","success");
  try{
   const el=document.createElement(info.kind==="image"?"img":info.kind);
   previewUrl=URL.createObjectURL(file);
   el.onerror=()=>{
    if(version!==selectionVersion)return;
    $("preview").replaceChildren();
    selection("Ready: "+label+". Preview unavailable; you can still publish.","success");
   };
   el.src=previewUrl;
   if(info.kind!=="image")el.controls=true;
   if(info.kind==="video")el.playsInline=true;
   $("preview").append(el);
  }catch(e){
   selection("Ready: "+label+". Preview unavailable; you can still publish.","success");
  }
 }catch(e){
  if(version!==selectionVersion)return;
  selection("Could not add "+(file.name||"this file")+": "+errorText(e),"error");
  status(errorText(e),"error");
 }
}

for(const id of pickerIds){
 const input=$(id);
 input.addEventListener("click",()=>{
  input.value="";
  if(!selectedFile)selection("Select a file in your phone's picker. If it shows a checkmark, tap Open or Done to finish.");
 });
 input.addEventListener("change",()=>{selectFile(input.files?.[0]);});
 input.addEventListener("cancel",()=>{
  if(!selectedFile)selectFile(null);
  else if(selectionReady)selection("Still selected: "+selectedFile.name+". Ready to publish.","success");
 });
}
for(const button of document.querySelectorAll("[data-picker]")){
 button.addEventListener("click",()=>{$(button.dataset.picker).click();});
}

async function uploadMedia(path,file,mime){
 const session=await db.auth.getSession();

 if(session.error)throw session.error;

 const token=session.data.session?.access_token;

 if(!token){
  throw Error("Session expired. Sign in again.");
 }

 if(!window.tus?.Upload){
  throw Error("Upload library unavailable. Refresh this page.");
 }

 status("Uploading... 0%");

 return new Promise((resolve,reject)=>{
  let finished=false;
  let lastActivity=Date.now();
  let watchdog;

  function finish(error){
   if(finished)return;

   finished=true;
   clearInterval(watchdog);

   error?reject(error):resolve();
  }

  const upload=new window.tus.Upload(file,{
   endpoint:
    SUPABASE_URL.replace(".supabase.co",".storage.supabase.co")+
    "/storage/v1/upload/resumable",

   headers:{
    apikey:SUPABASE_KEY
   },

   chunkSize:6*1048576,
   retryDelays:[0,3000,5000,10000,20000],
   uploadDataDuringCreation:true,
   fingerprint:async()=>"starrise-talent:"+path,
   removeFingerprintOnSuccess:true,
   fileReader:{
    async openFile(input){
     return {
      size:input.size,
      async slice(start,end){
       end=Math.min(end,input.size);
       if(start>=input.size)return {value:null,done:true};
       const bytes=await readChunk(input.slice(start,end,mime));
       return {value:new Blob([bytes],{type:mime}),done:end>=input.size};
      },
      close(){}
     };
    }
   },

   async onBeforeRequest(request){
    const current=await db.auth.getSession();

    if(current.error)throw current.error;

    const accessToken=current.data.session?.access_token;

    if(!accessToken){
     throw Error("Session expired. Sign in again.");
    }

    // Set this once: browser XHR appends repeated header values.
    request.setHeader("authorization","Bearer "+accessToken);
   },

   onAfterResponse(){
    lastActivity=Date.now();
   },

   metadata:{
    bucketName:BUCKET,
    objectName:path,
    contentType:mime,
    cacheControl:"3600"
   },

   onProgress(sent,total){
    lastActivity=Date.now();
    status("Uploading... "+Math.round(sent/total*100)+"%");
   },

   onError(e){
    const message=errorText(e);

    finish(Error(
     /Failed to fetch|NetworkError|status: 0/i.test(message)
      ?"Connection interrupted. Tap Publish Talent Post to retry."
      :"Upload failed: "+message
    ));
   },

   onSuccess(){
    finish();
   }
  });

  watchdog=setInterval(()=>{
   if(Date.now()-lastActivity>90000){
    upload.abort().catch(()=>{});

    finish(Error(
     "Connection interrupted. Tap Publish Talent Post to retry."
    ));
   }
  },5000);

  upload.findPreviousUploads().then(previous=>{
   if(finished)return;

   if(previous.length){
    upload.resumeFromPreviousUpload(previous[0]);
   }

   upload.start();
  }).catch(finish);
 });
}

$("postForm").addEventListener("submit",async event=>{
 event.preventDefault();

 if(!user)return;
 if(publishing)return;
 if(!selectionReady||!selectedFile){
  selection("Choose a readable file before publishing.","error");
  return;
 }

 const button=$("publish");

 publishing=true;
 button.disabled=true;
 for(const id of pickerIds)$(id).disabled=true;
 for(const picker of document.querySelectorAll("[data-picker]"))picker.disabled=true;

 try{
  const file=selectedFile;
  const info=fileInfo(file);

  if(
   !pendingPost||
   pendingPost.file!==file||
   pendingPost.creatorId!==user.id
  ){
   pendingPost={
    file,
    creatorId:user.id,
    id:crypto.randomUUID(),
    uploaded:false,
    path:
     user.id+"/"+new Date().toISOString().slice(0,10)+"/"+
     crypto.randomUUID()+"."+info.extension
   };
  }

  const post=pendingPost;

  if(!post.uploaded){
   await uploadMedia(post.path,file,info.mime);
   post.uploaded=true;
  }

  status("Saving your post...");

  const result=await db.from("talent_posts").insert({
   id:post.id,
   creator_id:user.id,
   caption:$("caption").value.trim(),
   media_path:post.path,
   media_kind:info.kind,
   media_mime_type:info.mime,
   visibility:$("visibility").value,
   status:"published"
  });

  if(result.error){
   // Check whether a lost response concealed a successful save.
   const existing=await db.from("talent_posts")
    .select("id")
    .eq("id",post.id)
    .maybeSingle();

   if(existing.error||!existing.data){
    throw result.error;
   }
  }

  pendingPost=null;
  selectedFile=null;
  selectionReady=false;
  selectionVersion++;

  $("postForm").reset();
  clearPreview();
  selection("Post published. Choose a file to share another talent.","success");

  await loadFeed();

  status("Your talent post is published!","success");
 }catch(e){
  selection("Could not publish: "+errorText(e),"error");
  status("Could not publish: "+errorText(e),"error");
 }finally{
  publishing=false;
  button.disabled=!selectionReady;
  for(const id of pickerIds)$(id).disabled=false;
  for(const picker of document.querySelectorAll("[data-picker]"))picker.disabled=false;
 }
});

function memberName(id){
 return profiles.get(id)?.display_name||"StarRise Member";
}

async function renderPost(post,likedPosts,likesAvailable){
 const card=document.createElement("article");
 card.className="card";
 card.id="post-"+post.id;
 const author=document.createElement("h3");
 author.textContent=memberName(post.creator_id);
 card.append(author);

 const meta=document.createElement("p");
 meta.className="post-meta";
 const audience={public:"Everyone",members:"Members",followers:"Followers",private:"Only Me"};
 meta.textContent=new Date(post.created_at).toLocaleString()+" • "+(audience[post.visibility]||"");
 card.append(meta);

 const media=await db.storage.from(BUCKET).createSignedUrl(post.media_path,300);
 if(!media.error&&media.data?.signedUrl){
  const element=document.createElement(post.media_kind==="image"?"img":post.media_kind==="audio"?"audio":"video");
  element.src=media.data.signedUrl;
  if(post.media_kind!=="image"){element.controls=true;element.preload="metadata";}
  else{element.alt="Talent shared by "+memberName(post.creator_id);element.loading="lazy";}
  if(post.media_kind==="video")element.playsInline=true;
  card.append(element);
 }else{
  const unavailable=document.createElement("p");
  unavailable.textContent="Media temporarily unavailable. Refresh the feed to try again.";
  card.append(unavailable);
 }
 const caption=document.createElement("p");
 caption.className="post-caption";
 caption.textContent=post.caption||"";
 card.append(caption);

 const actions=document.createElement("div");
 actions.className="post-actions";
 const feedback=document.createElement("p");
 feedback.className="post-feedback";
 feedback.setAttribute("role","status");
 function tell(message,type=""){
  feedback.textContent=message;
  feedback.className="post-feedback "+type;
 }
 let likeCount=Number(post.talent_post_likes?.[0]?.count||0);
 let liked=likedPosts.has(post.id);
 const total=document.createElement("span");
 const like=user?document.createElement("button"):null;
 function updateLikes(){
  total.textContent=likeCount+" like"+(likeCount===1?"":"s");
  if(like){
   like.textContent=liked?"Unlike":"Like";
   like.setAttribute("aria-pressed",String(liked));
  }
 }
 updateLikes();
 if(like){
  like.type="button";
  like.disabled=!likesAvailable;
  like.onclick=async()=>{
   if(like.disabled)return;
   like.disabled=true;
   const next=!liked;
   try{
    const r=next
     ?await db.from("talent_post_likes").insert({post_id:post.id,user_id:user.id})
     :await db.from("talent_post_likes").delete().eq("post_id",post.id).eq("user_id",user.id);
    if(r.error&&!(next&&r.error.code==="23505"))throw r.error;
    liked=next;
    const count=await db.from("talent_post_likes").select("post_id",{count:"exact",head:true}).eq("post_id",post.id);
    if(!count.error&&count.count!==null)likeCount=count.count;
    else if(!r.error)likeCount=Math.max(0,likeCount+(next?1:-1));
    updateLikes();
    tell(next?"Liked!":"Like removed.","success");
   }catch(e){tell("Could not update your like: "+errorText(e),"error");}
   finally{like.disabled=false;}
  };
  actions.append(like);
 }
 actions.append(total);

 // Share a page link; the original audience rules still govern access.
 const share=document.createElement("button");
 share.type="button";
 share.textContent="Share";
 share.onclick=async()=>{
  const url=new URL(location.href);
  url.search="";
  url.hash="";
  url.searchParams.set("post",post.id);
  try{
   if(navigator.share){
    await navigator.share({title:"Talent on StarRise",text:"View this StarRise talent post.",url:url.href});
    tell("Post link shared.","success");
   }else if(navigator.clipboard?.writeText){
    await navigator.clipboard.writeText(url.href);
    tell(post.visibility==="public"?"Post link copied!":"Post link copied. Only permitted viewers can open it.","success");
   }else{prompt("Copy this post link:",url.href);}
  }catch(e){
   if(e.name!=="AbortError")prompt("Copy this post link:",url.href);
  }
 };
 actions.append(share);
 card.append(actions,feedback);

 const details=document.createElement("details");
 details.className="comments";
 const summary=document.createElement("summary");
 let commentCount=Number(post.talent_post_comments?.[0]?.count||0);
 function updateComments(){
  summary.textContent=commentCount+" comment"+(commentCount===1?"":"s");
 }
 updateComments();
 const list=document.createElement("ul");
 list.className="comment-list";
 const commentStatus=document.createElement("p");
 commentStatus.setAttribute("role","status");
 const more=document.createElement("button");
 more.type="button";
 more.textContent="Earlier comments";
 more.hidden=true;
 const reload=document.createElement("button");
 reload.type="button";
 reload.textContent="Refresh comments";
 details.append(summary,list,commentStatus,more,reload);
 let commentsLoaded=false;
 let commentsLoading=false;
 let commentSaving=false;
 let offset=0;
 let seenComments=new Set();
 let send=null;
 const pageSize=20;

 async function loadComments(reset=true){
  if(commentsLoading)return false;
  commentsLoading=true;
  more.disabled=reload.disabled=true;
  if(send)send.disabled=true;
  commentStatus.textContent="Loading comments...";
  commentStatus.className="muted";
  try{
   const start=reset?0:offset;
   const r=await db.from("talent_post_comments")
    .select("id,author_id,body,created_at",{count:"exact"})
    .eq("post_id",post.id)
    .order("created_at",{ascending:false})
    .order("id",{ascending:false})
    .range(start,start+pageSize-1);
   if(r.error)throw r.error;
   const rows=r.data||[];
   if(reset){list.replaceChildren();seenComments=new Set();}
   const nodes=[];
   for(const row of [...rows].reverse()){
    if(seenComments.has(row.id))continue;
    seenComments.add(row.id);
    const item=document.createElement("li");
    const name=document.createElement("strong");
    name.textContent=memberName(row.author_id);
    const body=document.createElement("p");
    body.className="comment-body";
    body.textContent=row.body;
    const time=document.createElement("small");
    time.className="muted";
    time.textContent=new Date(row.created_at).toLocaleString();
    item.append(name,body,time);
    nodes.push(item);
   }
   reset?list.append(...nodes):list.prepend(...nodes);
   offset=start+rows.length;
   if(r.count!==null)commentCount=r.count;
   updateComments();
   more.hidden=rows.length<pageSize||(r.count!==null&&offset>=r.count);
   commentsLoaded=true;
   commentStatus.textContent=list.children.length?"":"No comments yet. Be the first to respond.";
   return true;
  }catch(e){
   commentStatus.textContent="Could not load comments: "+errorText(e);
   commentStatus.className="error";
   return false;
  }finally{
   commentsLoading=false;
   more.disabled=reload.disabled=false;
   if(send)send.disabled=commentSaving;
  }
 }
 details.addEventListener("toggle",()=>{
  if(details.open&&!commentsLoaded)loadComments();
 });
 more.onclick=()=>loadComments(false);
 reload.onclick=()=>loadComments(true);

 if(user){
  const form=document.createElement("form");
  form.className="comment-form";
  const input=document.createElement("textarea");
  input.placeholder="Add a comment";
  input.setAttribute("aria-label","Add a comment to this post");
  input.maxLength=1000;
  input.required=true;
  send=document.createElement("button");
  send.type="submit";
  send.textContent="Post Comment";
  form.append(input,send);
  form.onsubmit=async event=>{
   event.preventDefault();
   if(commentSaving||commentsLoading)return;
   const body=input.value.trim();
   if(!body){
    commentStatus.textContent="Write a comment before posting.";
    commentStatus.className="error";
    return;
   }
   commentSaving=true;
   send.disabled=true;
   try{
    const r=await db.from("talent_post_comments").insert({post_id:post.id,author_id:user.id,body});
    if(r.error)throw r.error;
    input.value="";
    const loaded=await loadComments(true);
    tell(loaded?"Comment posted.":"Comment saved. Tap Refresh comments to see it.","success");
   }catch(e){
    commentStatus.textContent="Could not post comment: "+errorText(e);
    commentStatus.className="error";
   }finally{commentSaving=false;send.disabled=commentsLoading;}
  };
  details.append(form);
 }else{
  const signIn=document.createElement("a");
  signIn.href="login.html";
  signIn.textContent="Sign in to like or comment";
  details.append(signIn);
 }
 card.append(details);

 if(user?.id===post.creator_id){
  const del=document.createElement("button");
  del.type="button";
  del.textContent="Delete Post";
  del.onclick=async()=>{
   if(!confirm("Delete this post?"))return;
   del.disabled=true;
   try{
    const r=await db.from("talent_posts").delete().eq("id",post.id).eq("creator_id",user.id);
    if(r.error)throw r.error;
    await db.storage.from(BUCKET).remove([post.media_path]);
    await loadFeed();
   }catch(e){tell("Could not delete post: "+errorText(e),"error");del.disabled=false;}
  };
  card.append(del);
 }
 return card;
}

async function loadFeed(){
 const version=++feedVersion;
 $("refresh").disabled=true;
 try{
  status("Loading posts...");
  const sharedId=new URLSearchParams(location.search).get("post");
  $("allPosts").hidden=!sharedId;
  if(sharedId&&!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(sharedId)){
   throw Error("This post link is invalid. Use View all community posts.");
  }
  let query=db.from("talent_posts")
   .select("id,creator_id,caption,media_path,media_kind,visibility,created_at,talent_post_likes(count),talent_post_comments(count)")
   .eq("status","published")
   .order("created_at",{ascending:false})
   .limit(30);
  if(sharedId)query=query.eq("id",sharedId);
  const result=await query;
  if(result.error)throw result.error;
  if(version!==feedVersion)return;
  if(!result.data?.length){
   $("feed").replaceChildren();
   status(sharedId?"This post is unavailable or you do not have permission to view it.":"No visible talent posts yet.");
   return;
  }
  let likedPosts=new Set();
  let likesAvailable=true;
  if(user){
   const mine=await db.from("talent_post_likes").select("post_id")
    .eq("user_id",user.id).in("post_id",result.data.map(post=>post.id));
   likesAvailable=!mine.error;
   likedPosts=new Set((mine.data||[]).map(row=>row.post_id));
  }
  const cards=await Promise.all(result.data.map(post=>renderPost(post,likedPosts,likesAvailable)));
  if(version!==feedVersion)return;
  $("feed").replaceChildren(...cards);
  status(likesAvailable?result.data.length+" posts loaded.":"Posts loaded. Refresh the feed to retry loading your likes.",likesAvailable?"success":"error");
 }catch(e){
  if(version===feedVersion)status("Feed error: "+errorText(e),"error");
 }finally{
  if(version===feedVersion)$("refresh").disabled=false;
 }
}

$("refresh").onclick=loadFeed;

if(!db){
 status("Supabase connection unavailable.","error");
 return;
}

try{
 const session=await db.auth.getSession();

 user=session.data.session?.user||null;

 $("composer").hidden=!user;
 $("guest").hidden=!!user;

 const members=await db.rpc("get_public_members");

 if(!members.error){
  profiles=new Map((members.data||[]).map(p=>[p.id,p]));
 }

 await loadFeed();
}catch(e){
 status("Community startup error: "+errorText(e),"error");
}

})();
</script>
