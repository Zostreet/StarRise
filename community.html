<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarRise Community</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090916;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#151526;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
a{color:#c6b2ff}
main{max-width:850px;margin:auto;padding:20px}
h1{font-size:40px}
.card{background:#19192b;border:1px solid #383850;border-radius:18px;padding:20px;margin:18px 0}
input,textarea,select{display:block;width:100%;padding:12px;margin:12px 0;background:#101020;color:white;border:1px solid #555;border-radius:10px}
textarea{min-height:90px}
button{background:#a98bff;border:0;border-radius:25px;padding:12px 20px;font-weight:bold;cursor:pointer;margin:5px}
button:disabled{opacity:.5}
video,img,audio{width:100%;max-height:550px;object-fit:contain;margin:12px 0}
.error{color:#ff9999}
.success{color:#99ffbb}
.muted{color:#aaa}
.picker{display:flex;flex-wrap:wrap;gap:4px}
#selectedInfo,#status{overflow-wrap:anywhere}
#selectedInfo{margin:12px 0;line-height:1.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<strong>⭐ StarRise</strong>
<nav>
<a href="index.html">Home</a>
<a href="members.html">Members</a>
<a href="marketplace.html">Store</a>
<a href="dashboard.html">Dashboard</a>
</nav>
</header>

<main>
<h1>Show Your Talent.</h1>
<p>Share your music, videos and photos with the world.</p>

<section id="composer" class="card" hidden>
<h2>Share Your Talent</h2>
<form id="postForm">
<div class="picker">
<button type="button" data-picker="videoFile">Choose Video</button>
<button type="button" data-picker="audioFile">Choose Song</button>
<button type="button" data-picker="imageFile">Choose Photo</button>
</div>
<input id="videoFile" type="file" accept="video/*" hidden>
<input id="audioFile" type="file" accept="audio/*" hidden>
<input id="imageFile" type="file" accept="image/*" hidden>
<label for="mediaFile">Or browse files on your phone</label>
<input id="mediaFile" type="file">
<p id="selectedInfo" class="muted" role="status" aria-live="polite">No file selected.</p>
<div id="preview"></div>

<textarea id="caption" maxlength="2200"
          placeholder="Tell us about your talent"></textarea>

<label>Visibility</label>
<select id="visibility">
<option value="public">Everyone</option>
<option value="members">Members</option>
<option value="followers">Followers</option>
<option value="private">Only Me</option>
</select>

<button id="publish" type="submit" disabled>Publish Talent Post</button>
</form>
</section>

<section id="guest" class="card" hidden>
<p>Sign in to share your talent.</p>
<a href="login.html">Sign In</a>
</section>

<div id="status" class="card">Loading Community...</div>
<button id="refresh">Refresh Feed</button>
<div id="feed"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script>
<script>
(async function(){
"use strict";

const SUPABASE_URL="https://rcnikxotdalxtuvpmlvm.supabase.co";
const SUPABASE_KEY="sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN";
const BUCKET="talent-posts";

const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let user=null;
let profiles=new Map();
let previewUrl="";
let pendingPost=null;
let selectedFile=null;
let selectionReady=false;
let selectionVersion=0;
let publishing=false;
const pickerIds=["mediaFile","videoFile","audioFile","imageFile"];

function status(message,type=""){
 $("status").textContent=message;
 $("status").className="card "+type;
 if(publishing)selection(message,type||"muted");
}

function errorText(e){
 return e?.message||String(e);
}

function fileInfo(file){
 if(!file)throw Error("Choose a file.");

 let extension=(file.name||"").split(".").pop().toLowerCase();
 const fromMime={
  "image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif",
  "audio/mpeg":"mp3","audio/wav":"wav","audio/x-wav":"wav",
  "audio/mp4":"m4a","audio/x-m4a":"m4a","audio/aac":"aac",
  "audio/ogg":"ogg","audio/flac":"flac","audio/x-flac":"flac",
  "video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov",
  "video/x-m4v":"m4v","video/3gpp":"3gp"
 };
 const images=["jpg","jpeg","png","webp","gif"];
 const audio=["mp3","wav","m4a","aac","ogg","flac"];
 const video=["mp4","webm","mov","m4v","3gp"];

 let kind;
 if(images.includes(extension))kind="image";
 else if(audio.includes(extension))kind="audio";
 else if(video.includes(extension))kind="video";
 else{
  extension=fromMime[(file.type||"").toLowerCase()];
  if(images.includes(extension))kind="image";
  else if(audio.includes(extension))kind="audio";
  else if(video.includes(extension))kind="video";
  else throw Error("Choose a supported photo, song or video file.");
 }

 const max=kind==="image"?15:kind==="audio"?100:null;

 if(!file.size){
  throw Error("That file is empty. Choose another file.");
 }

 if(max!==null&&file.size>max*1048576){
  throw Error("File exceeds "+max+" MB.");
 }

 const types={
  jpg:"image/jpeg",
  jpeg:"image/jpeg",
  png:"image/png",
  webp:"image/webp",
  gif:"image/gif",
  mp3:"audio/mpeg",
  m4a:"audio/mp4",
  wav:"audio/wav",
  aac:"audio/aac",
  ogg:"audio/ogg",
  flac:"audio/flac",
  mp4:"video/mp4",
  mov:"video/quicktime",
  m4v:"video/x-m4v",
  webm:"video/webm",
  "3gp":"video/3gpp"
 };

 return {
  kind,
  extension,
  mime:types[extension]||file.type||"application/octet-stream"
 };
}

function selection(message,type="muted"){
 $("selectedInfo").textContent=message;
 $("selectedInfo").className=type;
}

function clearPreview(){
 $("preview").replaceChildren();
 if(previewUrl)URL.revokeObjectURL(previewUrl);
 previewUrl="";
}

async function readChunk(blob){
 let bytes;
 try{
  bytes=await new Promise((resolve,reject)=>{
   const reader=new FileReader();
   const timer=setTimeout(()=>{
    reader.abort();
    reject(Error("File read timed out."));
   },25000);
   function finish(error,value){
    clearTimeout(timer);
    error?reject(error):resolve(value);
   }
   reader.onload=()=>finish(null,reader.result);
   reader.onerror=()=>finish(reader.error||Error("File read failed."));
   reader.onabort=()=>finish(Error("File read stopped."));
   try{reader.readAsArrayBuffer(blob);}catch(e){finish(e);}
  });
 }catch(e){
  if(typeof blob.arrayBuffer!=="function")throw Error(
   "Your phone could not read this file. Save it to Downloads, then use Browse Files to select that copy."
  );
  bytes=await new Promise((resolve,reject)=>{
   const timer=setTimeout(()=>reject(Error("File read timed out.")),25000);
   Promise.resolve().then(()=>blob.arrayBuffer()).then(
    value=>{clearTimeout(timer);resolve(value);},
    error=>{clearTimeout(timer);reject(error);}
   );
  }).catch(()=>{throw Error(
   "Your phone could not read this file. Save it to Downloads, then use Browse Files to select that copy."
  );});
 }
 if(!bytes||bytes.byteLength!==blob.size)throw Error("The file could not be read completely. Select it again using Browse Files.");
 return bytes;
}

async function selectFile(file){
 if(publishing)return;
 if(!file){
  if(!selectedFile)selection("No file was selected. Choose Video or Browse Files, then confirm your choice in the phone's picker.");
  return;
 }
 const version=++selectionVersion;
 selectedFile=file;
 selectionReady=false;
 pendingPost=null;
 clearPreview();
 $("publish").disabled=true;
 const label=(file.name||"Selected file")+" ("+(file.size/1048576).toFixed(1)+" MB)";
 selection("Selected: "+label+". Checking file...");
 try{
  const info=fileInfo(file);
  await readChunk(file.slice(0,Math.min(file.size,65536),info.mime));
  if(version!==selectionVersion)return;
  selectionReady=true;
  $("publish").disabled=false;
  selection("Ready: "+label,"success");
  status("Ready to publish.","success");
  try{
   const el=document.createElement(info.kind==="image"?"img":info.kind);
   previewUrl=URL.createObjectURL(file);
   el.onerror=()=>{
    if(version!==selectionVersion)return;
    $("preview").replaceChildren();
    selection("Ready: "+label+". Preview unavailable; you can still publish.","success");
   };
   el.src=previewUrl;
   if(info.kind!=="image")el.controls=true;
   if(info.kind==="video")el.playsInline=true;
   $("preview").append(el);
  }catch(e){
   selection("Ready: "+label+". Preview unavailable; you can still publish.","success");
  }
 }catch(e){
  if(version!==selectionVersion)return;
  selection("Could not add "+(file.name||"this file")+": "+errorText(e),"error");
  status(errorText(e),"error");
 }
}

for(const id of pickerIds){
 const input=$(id);
 input.addEventListener("click",()=>{
  input.value="";
  if(!selectedFile)selection("Select a file in your phone's picker. If it shows a checkmark, tap Open or Done to finish.");
 });
 input.addEventListener("change",()=>{selectFile(input.files?.[0]);});
 input.addEventListener("cancel",()=>{
  if(!selectedFile)selectFile(null);
  else if(selectionReady)selection("Still selected: "+selectedFile.name+". Ready to publish.","success");
 });
}
for(const button of document.querySelectorAll("[data-picker]")){
 button.addEventListener("click",()=>{$(button.dataset.picker).click();});
}

async function uploadMedia(path,file,mime){
 const session=await db.auth.getSession();

 if(session.error)throw session.error;

 const token=session.data.session?.access_token;

 if(!token){
  throw Error("Session expired. Sign in again.");
 }

 if(!window.tus?.Upload){
  throw Error("Upload library unavailable. Refresh this page.");
 }

 status("Uploading... 0%");

 return new Promise((resolve,reject)=>{
  let finished=false;
  let lastActivity=Date.now();
  let watchdog;

  function finish(error){
   if(finished)return;

   finished=true;
   clearInterval(watchdog);

   error?reject(error):resolve();
  }

  const upload=new window.tus.Upload(file,{
   endpoint:
    SUPABASE_URL.replace(".supabase.co",".storage.supabase.co")+
    "/storage/v1/upload/resumable",

   headers:{
    authorization:"Bearer "+token,
    apikey:SUPABASE_KEY
   },

   chunkSize:6*1048576,
   retryDelays:[0,3000,5000,10000,20000],
   uploadDataDuringCreation:true,
   fingerprint:async()=>"starrise-talent:"+path,
   removeFingerprintOnSuccess:true,
   fileReader:{
    async openFile(input){
     return {
      size:input.size,
      async slice(start,end){
       end=Math.min(end,input.size);
       if(start>=input.size)return {value:null,done:true};
       const bytes=await readChunk(input.slice(start,end,mime));
       return {value:new Blob([bytes],{type:mime}),done:end>=input.size};
      },
      close(){}
     };
    }
   },

   async onBeforeRequest(request){
    const current=await db.auth.getSession();

    if(current.error)throw current.error;

    const accessToken=current.data.session?.access_token;

    if(!accessToken){
     throw Error("Session expired. Sign in again.");
    }

    request.setHeader("authorization","Bearer "+accessToken);
   },

   onAfterResponse(){
    lastActivity=Date.now();
   },

   metadata:{
    bucketName:BUCKET,
    objectName:path,
    contentType:mime,
    cacheControl:"3600"
   },

   onProgress(sent,total){
    lastActivity=Date.now();
    status("Uploading... "+Math.round(sent/total*100)+"%");
   },

   onError(e){
    const message=errorText(e);

    finish(Error(
     /Failed to fetch|NetworkError|status: 0/i.test(message)
      ?"Connection interrupted. Tap Publish Talent Post to retry."
      :"Upload failed: "+message
    ));
   },

   onSuccess(){
    finish();
   }
  });

  watchdog=setInterval(()=>{
   if(Date.now()-lastActivity>90000){
    upload.abort().catch(()=>{});

    finish(Error(
     "Connection interrupted. Tap Publish Talent Post to retry."
    ));
   }
  },5000);

  upload.findPreviousUploads().then(previous=>{
   if(finished)return;

   if(previous.length){
    upload.resumeFromPreviousUpload(previous[0]);
   }

   upload.start();
  }).catch(finish);
 });
}

$("postForm").addEventListener("submit",async event=>{
 event.preventDefault();

 if(!user)return;
 if(publishing)return;
 if(!selectionReady||!selectedFile){
  selection("Choose a readable file before publishing.","error");
  return;
 }

 const button=$("publish");

 publishing=true;
 button.disabled=true;
 for(const id of pickerIds)$(id).disabled=true;
 for(const picker of document.querySelectorAll("[data-picker]"))picker.disabled=true;

 try{
  const file=selectedFile;
  const info=fileInfo(file);

  if(
   !pendingPost||
   pendingPost.file!==file||
   pendingPost.creatorId!==user.id
  ){
   pendingPost={
    file,
    creatorId:user.id,
    id:crypto.randomUUID(),
    uploaded:false,
    path:
     user.id+"/"+new Date().toISOString().slice(0,10)+"/"+
     crypto.randomUUID()+"."+info.extension
   };
  }

  const post=pendingPost;

  if(!post.uploaded){
   await uploadMedia(post.path,file,info.mime);
   post.uploaded=true;
  }

  status("Saving your post...");

  const result=await db.from("talent_posts").insert({
   id:post.id,
   creator_id:user.id,
   caption:$("caption").value.trim(),
   media_path:post.path,
   media_kind:info.kind,
   media_mime_type:info.mime,
   visibility:$("visibility").value,
   status:"published"
  });

  if(result.error){
   // Check whether a lost response concealed a successful save.
   const existing=await db.from("talent_posts")
    .select("id")
    .eq("id",post.id)
    .maybeSingle();

   if(existing.error||!existing.data){
    throw result.error;
   }
  }

  pendingPost=null;
  selectedFile=null;
  selectionReady=false;
  selectionVersion++;

  $("postForm").reset();
  clearPreview();
  selection("Post published. Choose a file to share another talent.","success");

  await loadFeed();

  status("Your talent post is published!","success");
 }catch(e){
  selection("Could not publish: "+errorText(e),"error");
  status("Could not publish: "+errorText(e),"error");
 }finally{
  publishing=false;
  button.disabled=!selectionReady;
  for(const id of pickerIds)$(id).disabled=false;
  for(const picker of document.querySelectorAll("[data-picker]"))picker.disabled=false;
 }
});

async function loadFeed(){
 try{
  status("Loading posts...");

  const result=await db.from("talent_posts")
   .select(
    "id,creator_id,caption,media_path,media_kind,visibility,created_at"
   )
   .eq("status","published")
   .order("created_at",{ascending:false})
   .limit(30);

  if(result.error)throw result.error;

  $("feed").replaceChildren();

  if(!result.data?.length){
   status("No visible talent posts yet.");
   return;
  }

  for(const post of result.data){
   const card=document.createElement("article");
   card.className="card";

   const author=document.createElement("h3");
   const profile=profiles.get(post.creator_id);

   author.textContent=profile?.display_name||"StarRise Creator";
   card.append(author);

   const media=await db.storage.from(BUCKET)
    .createSignedUrl(post.media_path,300);

   if(!media.error&&media.data?.signedUrl){
    const element=document.createElement(
     post.media_kind==="image"
      ?"img"
      :post.media_kind==="audio"
       ?"audio"
       :"video"
    );

    element.src=media.data.signedUrl;

    if(post.media_kind!=="image")element.controls=true;
    if(post.media_kind==="video")element.playsInline=true;

    card.append(element);
   }

   const caption=document.createElement("p");
   caption.textContent=post.caption||"";
   card.append(caption);

   if(user){
    const like=document.createElement("button");
    like.textContent="Like";

    like.onclick=async()=>{
     const r=await db.from("talent_post_likes").insert({
      post_id:post.id,
      user_id:user.id
     });

     status(
      r.error?errorText(r.error):"Liked!",
      r.error?"error":"success"
     );
    };

    card.append(like);

    const comment=document.createElement("form");
    const input=document.createElement("input");

    input.placeholder="Add a comment";
    input.maxLength=1000;
    input.required=true;

    const send=document.createElement("button");
    send.textContent="Comment";

    comment.append(input,send);

    comment.onsubmit=async e=>{
     e.preventDefault();

     const r=await db.from("talent_post_comments").insert({
      post_id:post.id,
      author_id:user.id,
      body:input.value.trim()
     });

     status(
      r.error?errorText(r.error):"Comment posted.",
      r.error?"error":"success"
     );

     if(!r.error)input.value="";
    };

    card.append(comment);

    if(user.id===post.creator_id){
     const del=document.createElement("button");
     del.textContent="Delete Post";

     del.onclick=async()=>{
      if(!confirm("Delete this post?"))return;

      const r=await db.from("talent_posts")
       .delete()
       .eq("id",post.id)
       .eq("creator_id",user.id);

      if(r.error){
       status(errorText(r.error),"error");
       return;
      }

      await db.storage.from(BUCKET).remove([post.media_path]);
      await loadFeed();
     };

     card.append(del);
    }
   }

   $("feed").append(card);
  }

  status(result.data.length+" posts loaded.","success");
 }catch(e){
  status("Feed error: "+errorText(e),"error");
 }
}

$("refresh").onclick=loadFeed;

if(!db){
 status("Supabase connection unavailable.","error");
 return;
}

try{
 const session=await db.auth.getSession();

 user=session.data.session?.user||null;

 $("composer").hidden=!user;
 $("guest").hidden=!!user;

 const members=await db.rpc("get_public_members");

 if(!members.error){
  profiles=new Map((members.data||[]).map(p=>[p.id,p]));
 }

 await loadFeed();
}catch(e){
 status("Community startup error: "+errorText(e),"error");
}

})();
</script>
</body>
</html>
