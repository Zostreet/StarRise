<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sign In | StarRise</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #080812;
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
    }

    .card {
      width: min(460px, 100%);
      padding: 32px;
      border: 1px solid #ffffff22;
      border-radius: 20px;
      background: #ffffff08;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 700;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ffffff33;
      background: #11111d;
      color: #fff;
    }

    button {
      margin-top: 22px;
      border: 0;
      background: #fff;
      color: #080812;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .msg {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #ffffff12;
    }

    .msg.show {
      display: block;
    }

    .msg.error {
      background: rgba(220, 70, 70, .15);
      border: 1px solid rgba(220, 70, 70, .4);
    }

    .msg.success {
      background: rgba(50, 180, 100, .15);
      border: 1px solid rgba(50, 180, 100, .4);
    }

    a {
      color: #fff;
    }
  </style>
</head>

<body>

<main class="card">

  <a href="index.html">← StarRise</a>

  <h1>Welcome back</h1>

  <p>Sign in to your StarRise member account.</p>

  <div
    id="msg"
    class="msg"
    role="status"
    aria-live="polite">
  </div>

  <form id="form">

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button id="btn" type="submit">
      Sign In
    </button>

  </form>

  <p>
    <a href="register.html">Create an account</a>
    ·
    <a href="reset-password.html">Forgot password?</a>
  </p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const starRiseSupabase = window.supabase.createClient(
  'https://rcnikxotdalxtuvpmlvm.supabase.co',
  'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN'
);

const form = document.getElementById('form');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

function showMessage(text, type = '') {

  msg.textContent = text;
  msg.className = 'msg show ' + type;

}

async function checkExistingSession() {

  try {

    const {
      data,
      error
    } = await starRiseSupabase.auth.getSession();

    if (error) {
      console.error('Session check error:', error);
      return;
    }

    if (data.session) {

      window.location.replace('dashboard.html');

    }

  } catch (error) {

    console.error('Session error:', error);

  }

}

checkExistingSession();

form.addEventListener('submit', async (event) => {

  event.preventDefault();

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  if (!email || !password) {

    showMessage(
      'Please enter your email and password.',
      'error'
    );

    return;

  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  showMessage('Connecting to StarRise...');

  try {

    const {
      data,
      error
    } = await starRiseSupabase.auth.signInWithPassword({

      email: email,

      password: password

    });

    if (error) {

      console.error('Login error:', error);

      showMessage(
        error.message ||
        'We could not sign you in.',
        'error'
      );

      btn.disabled = false;
      btn.textContent = 'Sign In';

      return;

    }

    if (!data.session) {

      showMessage(
        'Your login was accepted, but no session was created. Please try again.',
        'error'
      );

      btn.disabled = false;
      btn.textContent = 'Sign In';

      return;

    }

    showMessage(
      'Signed in successfully. Opening your StarRise dashboard...',
      'success'
    );

    setTimeout(() => {

      window.location.replace('dashboard.html');

    }, 700);

  } catch (error) {

    console.error('Unexpected login error:', error);

    showMessage(
      'Something went wrong while signing in. Please try again.',
      'error'
    );

    btn.disabled = false;
    btn.textContent = 'Sign In';

  }

});

</script>

</body>
</html>
