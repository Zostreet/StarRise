<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarRise Service</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080812;
      color: #fff;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid #ffffff18;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: #bbb;
      text-decoration: none;
      font-weight: normal;
    }

    nav a:hover {
      color: #fff;
    }

    main {
      width: min(850px, calc(100% - 30px));
      margin: 40px auto 70px;
    }

    .card {
      border: 1px solid #ffffff18;
      border-radius: 22px;
      background: #ffffff08;
      padding: 28px;
    }

    .muted {
      color: #aaa;
    }

    .service-title {
      font-size: 32px;
      margin: 0 0 8px;
    }

    .service-description {
      color: #ccc;
      white-space: pre-wrap;
      margin: 18px 0;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin: 20px 0;
    }

    .provider {
      padding: 16px;
      border-radius: 14px;
      background: #ffffff08;
      margin: 20px 0;
    }

    .provider strong {
      display: block;
      margin-bottom: 4px;
    }

    .request-box {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #ffffff12;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid #ffffff20;
      background: #080812;
      color: #fff;
      font: inherit;
      margin-top: 10px;
    }

    textarea:focus {
      outline: none;
      border-color: #ffffff55;
    }

    button {
      font: inherit;
    }

    .checkout-button {
      width: 100%;
      border: 0;
      border-radius: 28px;
      padding: 14px 22px;
      background: #fff;
      color: #080812;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .checkout-button:hover {
      opacity: .9;
    }

    .checkout-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #fff;
    }

    .status {
      padding: 14px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    .status.error {
      display: block;
      color: #ffb5b5;
      background: rgba(200, 50, 50, .12);
    }

    .status.success {
      display: block;
      color: #baffca;
      background: rgba(50, 200, 100, .10);
    }

    .status.info {
      display: block;
      color: #ccc;
      background: #ffffff08;
    }

    @media (max-width: 650px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        gap: 12px;
      }

      main {
        width: calc(100% - 20px);
        margin-top: 20px;
      }

      .card {
        padding: 20px;
      }

      .service-title {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">⭐ StarRise</a>

  <nav>
    <a href="services.html">Services</a>
    <a href="members.html">Members</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="music.html">Music</a>
  </nav>
</header>

<main>

  <div class="card">

    <div id="loading" class="status info">
      Loading service...
    </div>

    <div id="service-content" style="display:none;">

      <p class="muted">StarRise Service</p>

      <h1 id="service-title" class="service-title">
        Service
      </h1>

      <div id="service-description"
           class="service-description"></div>

      <div id="service-price" class="price">
        $0.00
      </div>

      <div class="provider">

        <span class="muted">
          Provided by
        </span>

        <strong id="provider-name">
          Provider
        </strong>

        <span id="provider-location"
              class="muted">
        </span>

      </div>

      <div class="request-box">

        <h2>Request This Service</h2>

        <p class="muted">
          Tell the provider what you need.
          You'll continue to secure checkout
          after submitting your request.
        </p>

        <label for="request-message">
          What do you need?
        </label>

        <textarea
          id="request-message"
          maxlength="2000"
          placeholder="Tell the provider what you need..."
        ></textarea>

        <button
          id="checkout-button"
          class="checkout-button"
          type="button"
        >
          Continue to Checkout
        </button>

        <div
          id="checkout-status"
          class="status"
        ></div>

      </div>

      <a
        href="services.html"
        class="back-link"
      >
        ← Back to Services
      </a>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {

  'use strict';

  const SUPABASE_URL =
    'https://rcnikxotdalxtuvpmlvm.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN';

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const loading =
    document.getElementById('loading');

  const content =
    document.getElementById('service-content');

  const checkoutButton =
    document.getElementById('checkout-button');

  const checkoutStatus =
    document.getElementById('checkout-status');

  let currentUser = null;
  let service = null;

  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }

  function getField(object, fields, fallback) {

    for (const field of fields) {

      if (
        object &&
        object[field] !== undefined &&
        object[field] !== null &&
        object[field] !== ''
      ) {
        return object[field];
      }

    }

    return fallback;
  }

  function getServiceId() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return (
      params.get('id') ||
      params.get('service_id') ||
      params.get('service')
    );

  }

  function formatMoney(value) {

    const number =
      Number(value || 0);

    /*
      Supports both cents and normal
      dollar values.
    */

    if (number >= 1000) {

      return '$' +
        (number / 100).toFixed(2);

    }

    return '$' +
      number.toFixed(2);

  }

  function showStatus(message, type) {

    checkoutStatus.textContent =
      message;

    checkoutStatus.className =
      'status ' + type;

  }

  async function loadPage() {

    try {

      const sessionResult =
        await supabaseClient.auth.getSession();

      if (sessionResult.error) {
        throw sessionResult.error;
      }

      const session =
        sessionResult.data &&
        sessionResult.data.session;

      if (!session || !session.user) {

        window.location.href =
          'login.html';

        return;

      }

      currentUser =
        session.user;

      const serviceId =
        getServiceId();

      if (!serviceId) {

        throw new Error(
          'No service was specified.'
        );

      }

      const result =
        await supabaseClient
          .from('star_rise_services')
          .select('*')
          .eq('id', serviceId)
          .maybeSingle();

      if (result.error) {
        throw result.error;
      }

      if (!result.data) {

        throw new Error(
          'Service not found.'
        );

      }

      service =
        result.data;

      renderService();

    } catch (error) {

      console.error(
        'Service page error:',
        error
      );

      loading.className =
        'status error';

      loading.style.display =
        'block';

      loading.textContent =
        'Unable to load service: ' +
        error.message;

    }

  }

  async function loadProvider(providerId) {

    if (!providerId) {
      return null;
    }

    const result =
      await supabaseClient
        .from('Profiles')
        .select('*')
        .eq('id', providerId)
        .maybeSingle();

    if (result.error) {

      console.error(
        'Provider profile error:',
        result.error
      );

      return null;

    }

    return result.data;

  }

  async function renderService() {

    loading.style.display =
      'none';

    content.style.display =
      'block';

    const title =
      getField(
        service,
        ['title', 'name', 'service_name'],
        'Service'
      );

    const description =
      getField(
        service,
        ['description', 'details', 'bio'],
        ''
      );

    const price =
      getField(
        service,
        ['price', 'price_cents', 'amount'],
        0
      );

    /*
      Seller/provider ID is now the
      correct field for StarRise.
    */

    const sellerId =
      getField(
        service,
        [
          'seller_id',
          'Seller_id',
          'provider_id',
          'Provider_id'
        ],
        null
      );

    document.getElementById(
      'service-title'
    ).textContent =
      title;

    document.getElementById(
      'service-description'
    ).textContent =
      description;

    document.getElementById(
      'service-price'
    ).textContent =
      formatMoney(price);

    const provider =
      await loadProvider(sellerId);

    if (provider) {

      const providerName =
        getField(
          provider,
          [
            'display_name',
            'Display_Name',
            'stage_name',
            'Stage_Name',
            'full_name',
            'Full_Name',
            'name',
            'Name'
          ],
          'StarRise Member'
        );

      const location =
        getField(
          provider,
          [
            'location',
            'Location'
          ],
          ''
        );

      document.getElementById(
        'provider-name'
      ).textContent =
        providerName;

      document.getElementById(
        'provider-location'
      ).textContent =
        location;

    }

  }

  async function createCheckout() {

    if (!currentUser) {

      throw new Error(
        'You must be signed in.'
      );

    }

    if (!service) {

      throw new Error(
        'Service information is missing.'
      );

    }

    const requestMessage =
      document
        .getElementById(
          'request-message'
        )
        .value
        .trim();

    if (!requestMessage) {

      throw new Error(
        'Please tell the provider what you need.'
      );

    }

    /*
      StarRise now uses buyer_id and seller_id.
    */

    const buyerId =
      currentUser.id;

    const sellerId =
      getField(
        service,
        [
          'seller_id',
          'Seller_id',
          'provider_id',
          'Provider_id'
        ],
        null
      );

    if (!sellerId) {

      throw new Error(
        'This service does not have a seller assigned.'
      );

    }

    if (sellerId === buyerId) {

      throw new Error(
        'You cannot purchase your own service.'
      );

    }

    showStatus(
      'Preparing secure checkout...',
      'info'
    );

    checkoutButton.disabled =
      true;

    checkoutButton.textContent =
      'Preparing Checkout...';

    /*
      IMPORTANT:
      Send buyer_id and seller_id
      to the Edge Function.
    */

    const result =
      await supabaseClient.functions.invoke(
        'create-checkout',
        {
          body: {
            service_id: service.id,
            buyer_id: buyerId,
            seller_id: sellerId,
            request_message: requestMessage
          }
        }
      );

    if (result.error) {

      console.error(
        'create-checkout error:',
        result.error
      );

      let message =
        result.error.message ||
        'Unable to start checkout.';

      if (
        result.data &&
        typeof result.data === 'object'
      ) {

        message =
          result.data.error ||
          result.data.message ||
          message;

      }

      throw new Error(message);

    }

    const data =
      result.data;

    /*
      The Edge Function may return
      checkout_url, url, or session_url.
    */

    const checkoutUrl =
      data &&
      (
        data.checkout_url ||
        data.url ||
        data.session_url
      );

    if (!checkoutUrl) {

      console.error(
        'Checkout response:',
        data
      );

      throw new Error(
        'Checkout was created, but no checkout URL was returned.'
      );

    }

    showStatus(
      'Redirecting to secure checkout...',
      'success'
    );

    window.location.href =
      checkoutUrl;

  }

  checkoutButton.addEventListener(
    'click',
    async function () {

      try {

        await createCheckout();

      } catch (error) {

        console.error(
          'Checkout failed:',
          error
        );

        showStatus(
          'Checkout error: ' +
          error.message,
          'error'
        );

        checkoutButton.disabled =
          false;

        checkoutButton.textContent =
          'Continue to Checkout';

      }

    }
  );

  loadPage();

})();
</script>

</body>
</html>
