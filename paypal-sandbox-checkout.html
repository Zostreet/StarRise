<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPal Sandbox Checkout | StarRise Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f2f9;color:#1c1524;font-family:Arial,sans-serif;line-height:1.5}
    .top{background:#190d31;color:#fff;padding:18px}
    .top a{color:#fff;text-decoration:none;font-weight:900}
    .wrap{width:min(760px,calc(100% - 32px));margin:auto;padding:44px 0 70px}
    h1{font-size:clamp(38px,8vw,58px);line-height:1;margin:10px 0}
    .lead{color:#6d6375;font-size:18px}
    .card{margin-top:24px;background:#fff;border:1px solid #ded5e5;border-radius:18px;padding:22px}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    .button{border:0;border-radius:10px;padding:14px 18px;background:#5b1aa6;color:#fff;font:inherit;font-weight:900;cursor:pointer}
    .button.secondary{background:#176b45}
    .button.ghost{background:#eee7f4;color:#4d1c7e}
    .button.danger{background:#9d2639}
    .button:disabled{opacity:.55;cursor:wait}
    .result{margin-top:18px;padding:17px;border-radius:12px;background:#f7f3fa;font-weight:800;white-space:pre-wrap}
    .good{background:#e2f5ea;color:#176b45}
    .bad{background:#fde9eb;color:#9d2639}
    .warn{background:#fff3d8;color:#755000}
    .note{margin-top:18px;color:#6d6375}
    .hidden{display:none!important}
  </style>
</head>
<body>
<header class="top"><a href="founding-creator-command-center.html">⭐ StarRise Admin</a></header>
<main class="wrap">
  <div>PRIVATE PAYMENT SETUP</div>
  <h1>PayPal Sandbox Checkout</h1>
  <p class="lead">Run one controlled $1.00 USD PayPal sandbox purchase from creation through capture.</p>
  <section class="card">
    <div id="auth">Verifying administrator access…</div>
    <div class="actions">
      <button id="start" class="button hidden" type="button">Start $1 Sandbox Checkout</button>
      <button id="continue" class="button secondary hidden" type="button">Continue PayPal Approval</button>
      <button id="resume" class="button ghost hidden" type="button">Check or Resume Capture</button>
      <button id="cancel" class="button danger hidden" type="button">Cancel Stored Test</button>
    </div>
    <div id="result" class="result hidden" role="status" aria-live="polite"></div>
    <p class="note">Sandbox only. PayPal credentials, access tokens, and merchant secrets remain on the server.</p>
  </section>
</main>
<script>
'use strict';

const db = window.supabase.createClient(
  'https://rcnikxotdalxtuvpmlvm.supabase.co',
  'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN'
);

const STORAGE_KEY = 'starrise_paypal_sandbox_order';
const auth = document.getElementById('auth');
const start = document.getElementById('start');
const continueButton = document.getElementById('continue');
const resume = document.getElementById('resume');
const cancel = document.getElementById('cancel');
const result = document.getElementById('result');
const actionButtons = [start, continueButton, resume, cancel];

function isValidOrderId(value) {
  return typeof value === 'string' && /^[A-Z0-9]{8,30}$/i.test(value);
}

function safeApprovalUrl(value) {
  if (!value) return '';
  try {
    const url = new URL(value);
    if (url.protocol !== 'https:' || !/(^|\.)paypal\.com$/i.test(url.hostname)) return '';
    return url.href;
  } catch {
    return '';
  }
}

function readStoredOrder() {
  const raw = sessionStorage.getItem(STORAGE_KEY);
  if (!raw) return null;

  try {
    const parsed = JSON.parse(raw);
    const orderId = parsed?.order_id || parsed?.orderId;
    if (!isValidOrderId(orderId)) throw new Error('Invalid stored order');
    return {
      orderId,
      approvalUrl: safeApprovalUrl(parsed?.approval_url || parsed?.approvalUrl),
    };
  } catch {
    if (isValidOrderId(raw)) return { orderId: raw, approvalUrl: '' };
    sessionStorage.removeItem(STORAGE_KEY);
    return null;
  }
}

function storeOrder(orderId, approvalUrl = '') {
  sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
    order_id: orderId,
    approval_url: safeApprovalUrl(approvalUrl),
    created_at: new Date().toISOString(),
  }));
}

function clearStoredOrder() {
  sessionStorage.removeItem(STORAGE_KEY);
}

function show(message, type = '') {
  result.className = 'result ' + type;
  result.textContent = message;
  result.classList.remove('hidden');
}

function setBusy(busy) {
  actionButtons.forEach(button => { button.disabled = busy; });
}

function cleanCallbackUrl() {
  history.replaceState({}, document.title, 'paypal-sandbox-checkout.html');
}

async function functionErrorMessage(error, data, fallback) {
  if (typeof data?.error === 'string') return data.error;
  const response = error?.context;
  if (response && typeof response.clone === 'function') {
    try {
      const body = await response.clone().json();
      if (typeof body?.error === 'string') return body.error;
    } catch {
      // Supabase may already have consumed a non-JSON error body.
    }
  }
  return error?.message || fallback;
}

function renderActions() {
  const stored = readStoredOrder();
  start.classList.toggle('hidden', Boolean(stored));
  resume.classList.toggle('hidden', !stored);
  cancel.classList.toggle('hidden', !stored);
  continueButton.classList.toggle('hidden', !stored?.approvalUrl);
  setBusy(false);
}

async function getSession() {
  const { data, error } = await db.auth.getSession();
  if (error) throw error;
  return data.session;
}

async function requireAdmin() {
  const session = await getSession();
  if (!session) {
    const redirect = encodeURIComponent('paypal-sandbox-checkout.html' + location.search);
    location.replace('login.html?redirect=' + redirect);
    return null;
  }

  const { data: admin, error } = await db
    .from('platform_admins')
    .select('access_level')
    .eq('user_id', session.user.id)
    .maybeSingle();

  if (error) throw error;
  if (!admin) {
    auth.textContent = 'Access denied. This page is limited to StarRise administrators.';
    return null;
  }

  auth.textContent = 'Administrator access confirmed: ' + admin.access_level + '.';
  return session;
}

async function startCheckout() {
  setBusy(true);
  start.textContent = 'Creating PayPal Order…';
  show('Creating a $1.00 USD PayPal sandbox order…');

  try {
    const { data, error } = await db.functions.invoke('paypal-sandbox-create-order', { body: {} });
    if (error || !isValidOrderId(data?.order_id)) {
      throw new Error(await functionErrorMessage(error, data, 'PayPal did not create a valid order.'));
    }

    const approvalUrl = safeApprovalUrl(data?.approval_url);
    if (!approvalUrl) throw new Error('PayPal did not return a trusted approval URL.');

    storeOrder(data.order_id, approvalUrl);
    show('Order created. Redirecting to PayPal sandbox for buyer approval…', 'warn');
    location.assign(approvalUrl);
  } catch (error) {
    show('Could not start checkout: ' + (error?.message || 'Unknown error'), 'bad');
    start.textContent = 'Try Again';
    renderActions();
  }
}

async function captureOrder(orderId) {
  if (!isValidOrderId(orderId)) throw new Error('The stored PayPal order ID is invalid.');

  const stored = readStoredOrder();
  if (!stored) storeOrder(orderId);

  setBusy(true);
  resume.textContent = 'Checking PayPal…';
  show('Checking PayPal approval and capture status…', 'warn');

  try {
    const { data, error } = await db.functions.invoke('paypal-sandbox-capture-order', {
      body: { order_id: orderId },
    });
    if (error) throw new Error(await functionErrorMessage(error, data, 'PayPal capture could not be checked.'));

    if (data?.status === 'APPROVAL_REQUIRED') {
      show('This order still needs buyer approval in PayPal sandbox. Continue approval, then return here to capture it.', 'warn');
      cleanCallbackUrl();
      renderActions();
      return;
    }

    if (data?.status === 'PENDING') {
      const reason = data.pending_reason ? '\nPayPal reason: ' + data.pending_reason : '';
      show(
        'PayPal accepted the capture, but settlement is pending.\nOrder ID: ' + data.order_id +
        '\nCapture ID: ' + data.capture_id + reason +
        '\nUse “Check or Resume Capture” to reconcile the final status.',
        'warn'
      );
      cleanCallbackUrl();
      renderActions();
      return;
    }

    if (data?.status !== 'COMPLETED' || !data?.capture_id) {
      throw new Error(data?.error || 'Capture did not complete.');
    }

    clearStoredOrder();
    cleanCallbackUrl();
    show(
      'PayPal sandbox purchase completed successfully.\nOrder ID: ' + data.order_id +
      '\nCapture ID: ' + data.capture_id +
      '\nAmount: ' + (data.amount || '1.00') + ' ' + (data.currency || 'USD') +
      '\nStatus: ' + data.status +
      (data.reconciled ? '\nRecovery: reconciled from PayPal.' : ''),
      'good'
    );
    start.textContent = 'Run Another $1 Test';
    renderActions();
  } catch (error) {
    show('Could not complete checkout: ' + (error?.message || 'Unknown error'), 'bad');
    renderActions();
  } finally {
    resume.textContent = 'Check or Resume Capture';
  }
}

async function cancelOrder(orderId, message = 'The PayPal sandbox checkout was canceled.') {
  if (!isValidOrderId(orderId)) throw new Error('The stored PayPal order ID is invalid.');

  setBusy(true);
  cancel.textContent = 'Canceling Test…';
  show('Confirming the sandbox order can be canceled safely…', 'warn');

  try {
    const { data, error } = await db.functions.invoke('paypal-sandbox-cancel-order', {
      body: { order_id: orderId },
    });
    if (error || data?.status !== 'CANCELLED') {
      throw new Error(await functionErrorMessage(error, data, 'The sandbox order could not be canceled.'));
    }

    clearStoredOrder();
    cleanCallbackUrl();
    show(message + '\nOrder ID: ' + data.order_id + '\nNo capture was made.', 'warn');
    start.textContent = 'Start $1 Sandbox Checkout';
    renderActions();
  } catch (error) {
    show('Could not cancel checkout: ' + (error?.message || 'Unknown error'), 'bad');
    renderActions();
  } finally {
    cancel.textContent = 'Cancel Stored Test';
  }
}

start.addEventListener('click', startCheckout);

continueButton.addEventListener('click', () => {
  const stored = readStoredOrder();
  if (!stored?.approvalUrl) {
    show('The approval link is no longer available. Check the order status or cancel this stored test.', 'bad');
    return;
  }
  location.assign(stored.approvalUrl);
});

resume.addEventListener('click', () => {
  const stored = readStoredOrder();
  if (!stored) {
    show('No unfinished PayPal sandbox order was found.', 'bad');
    renderActions();
    return;
  }
  captureOrder(stored.orderId);
});

cancel.addEventListener('click', () => {
  const stored = readStoredOrder();
  if (!stored) {
    show('No unfinished PayPal sandbox order was found.', 'bad');
    renderActions();
    return;
  }
  cancelOrder(stored.orderId, 'The stored PayPal sandbox test was canceled.');
});

(async () => {
  try {
    const session = await requireAdmin();
    if (!session) return;

    const params = new URLSearchParams(location.search);
    const paypalState = params.get('paypal');
    const returnedOrder = params.get('token');
    const stored = readStoredOrder();

    if (returnedOrder && !isValidOrderId(returnedOrder)) {
      throw new Error('PayPal returned an invalid order ID.');
    }
    if (returnedOrder && stored && returnedOrder !== stored.orderId) {
      throw new Error('Returned PayPal order does not match the StarRise test order.');
    }

    if (paypalState === 'cancel') {
      const orderId = returnedOrder || stored?.orderId;
      if (!orderId) {
        cleanCallbackUrl();
        show('PayPal sandbox checkout was canceled before StarRise recorded an order.', 'warn');
        renderActions();
        return;
      }
      await cancelOrder(orderId);
      return;
    }

    if (paypalState === 'return') {
      const orderId = returnedOrder || stored?.orderId;
      if (!orderId) throw new Error('PayPal returned without an order ID.');
      if (!stored) storeOrder(orderId);
      await captureOrder(orderId);
      return;
    }

    if (stored) {
      show('An unfinished PayPal sandbox order is stored. Continue approval, check its capture status, or cancel it safely.', 'warn');
    }
    renderActions();
  } catch (error) {
    auth.textContent = 'Administrator verification or callback validation failed.';
    show('Sandbox checkout error: ' + (error?.message || 'Unknown error'), 'bad');
    actionButtons.forEach(button => button.classList.add('hidden'));
  }
})();
</script>
</body>
</html>
