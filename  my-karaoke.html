<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Performances | StarRise</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#100b24;
 color:#fff;
 font:16px Arial,sans-serif;
 line-height:1.5
}
header{
 background:#1d1234;
 padding:20px;
 text-align:center;
 border-bottom:2px solid #a86bff
}
main{max-width:850px;margin:auto;padding:18px}
h1,h2{color:#e0bdff}
a{color:#e0bdff}
nav{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
 margin:15px 0
}
nav a,button{
 background:#a86bff;
 color:#180e2a;
 border:0;
 border-radius:10px;
 padding:11px 15px;
 font-weight:bold;
 text-decoration:none;
 cursor:pointer
}
button:disabled{opacity:.5;cursor:default}
.secondary{background:#443258;color:white}
.card{
 background:#241839;
 border:1px solid #574375;
 border-radius:16px;
 padding:18px;
 margin:18px 0
}
video,audio{width:100%;margin:12px 0}
select{
 display:block;
 width:100%;
 padding:12px;
 margin:12px 0;
 background:#140e28;
 color:white;
 border:1px solid #6b5588;
 border-radius:9px;
 font:inherit
}
.muted{color:#c7b9d9}
.status{white-space:pre-wrap;color:#dfc8ff}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px
}
</style>
</head>
<body>

<header>
<h1>My StarRise Performances</h1>
<p>Watch • Manage • Share Your Talent</p>
<nav>
<a href="karaoke.html">Karaoke Studio</a>
<a href="karaoke-publish.html">Publish Performance</a>
<a href="dashboard.html">Dashboard</a>
</nav>
</header>

<main>
<section class="card">
<h2>My Performance Library</h2>
<p id="account">Checking your account...</p>
<button id="refresh">Refresh Performances</button>
<p id="status" class="status"></p>
</section>

<div id="posts"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";

const $=id=>document.getElementById(id);

const db=window.supabase.createClient(
 "https://rcnikxotdalxtuvpmlvm.supabase.co",
 "sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN"
);

let currentUser=null;

const options=[
 ["private","Only Me"],
 ["followers","Followers"],
 ["members","StarRise Members"],
 ["public","Everyone"]
];

function setStatus(text){
 $("status").textContent=text;
}

async function loadPosts(){
 const list=$("posts");
 list.replaceChildren();

 setStatus("Loading performances...");

 const {data:auth,error:authError}=
  await db.auth.getUser();

 currentUser=authError?null:auth.user;

 if(!currentUser){
  $("account").textContent="Not signed in.";
  setStatus(
   "Sign in through Karaoke Studio or your dashboard first."
  );
  return;
 }

 $("account").textContent=
  "Signed in: "+currentUser.email;

 const {data,error}=await db
  .from("talent_posts")
  .select(
   "id,caption,media_path,media_kind,visibility,status,created_at"
  )
  .eq("creator_id",currentUser.id)
  .order("created_at",{ascending:false})
  .limit(100);

 if(error){
  setStatus("Could not load performances: "+error.message);
  return;
 }

 if(!data.length){
  setStatus("No performances found yet.");
  return;
 }

 setStatus(data.length+" post(s) found.");

 for(const post of data){
  renderPost(post,list);
 }
}

function renderPost(post,list){
 const card=document.createElement("article");
 card.className="card";

 const title=document.createElement("h2");
 title.textContent=
  (post.caption||"Untitled Performance").split("\n")[0];

 const date=document.createElement("p");
 date.className="muted";
 date.textContent=new Date(post.created_at)
  .toLocaleString();

 const caption=document.createElement("p");
 caption.style.whiteSpace="pre-wrap";
 caption.textContent=post.caption||"";

 const mediaArea=document.createElement("div");

 const play=document.createElement("button");
 play.textContent="Play Performance";

 play.onclick=async()=>{
  play.disabled=true;

  const {data,error}=await db.storage
   .from("talent-posts")
   .createSignedUrl(post.media_path,3600);

  play.disabled=false;

  if(error){
   alert("Playback unavailable: "+error.message);
   return;
  }

  mediaArea.replaceChildren();

  const media=document.createElement(
   post.media_kind==="video"?"video":
   post.media_kind==="audio"?"audio":"img"
  );

  media.src=data.signedUrl;

  if(post.media_kind!=="image"){
   media.controls=true;
   media.playsInline=true;
  }else{
   media.style.width="100%";
  }

  mediaArea.appendChild(media);
 };

 const visibilityLabel=document.createElement("label");
 visibilityLabel.textContent="Who Can See This?";

 const visibility=document.createElement("select");

 for(const [value,label] of options){
  const option=document.createElement("option");
  option.value=value;
  option.textContent=label;
  visibility.appendChild(option);
 }

 visibility.value=post.visibility;

 const save=document.createElement("button");
 save.textContent="Save Visibility";

 const notice=document.createElement("p");
 notice.className="status";

 save.onclick=async()=>{
  const newVisibility=visibility.value;

  if(
   newVisibility==="public" &&
   post.visibility!=="public"
  ){
   const approved=confirm(
    "Make this performance visible to everyone?"
   );
   if(!approved)return;
  }

  save.disabled=true;
  notice.textContent="Saving...";

  const {error}=await db
   .from("talent_posts")
   .update({visibility:newVisibility})
   .eq("id",post.id)
   .eq("creator_id",currentUser.id);

  save.disabled=false;

  if(error){
   notice.textContent="Update failed: "+error.message;
   visibility.value=post.visibility;
  }else{
   post.visibility=newVisibility;
   notice.textContent="Visibility saved.";
  }
 };

 const download=document.createElement("button");
 download.textContent="Open Media";
 download.className="secondary";

 download.onclick=async()=>{
  const {data,error}=await db.storage
   .from("talent-posts")
   .createSignedUrl(post.media_path,60);

  if(error){
   alert(error.message);
   return;
  }

  window.open(
   data.signedUrl,
   "_blank",
   "noopener,noreferrer"
  );
 };

 const actions=document.createElement("div");
 actions.className="actions";
 actions.append(play,download,save);

 card.append(
  title,
  date,
  caption,
  mediaArea,
  visibilityLabel,
  visibility,
  actions,
  notice
 );

 list.appendChild(card);
}

$("refresh").onclick=loadPosts;
loadPosts();
</script>
</body>
</html>
