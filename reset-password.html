<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | StarRise</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #080812;
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
    }

    .card {
      width: min(460px, 100%);
      padding: 32px;
      border: 1px solid #ffffff22;
      border-radius: 20px;
      background: #ffffff08;
    }

    a {
      color: #fff;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 700;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    input {
      border: 1px solid #ffffff33;
      background: #11111d;
      color: #fff;
    }

    button {
      margin-top: 22px;
      border: 0;
      background: #fff;
      color: #080812;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .msg {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #ffffff12;
    }

    .msg.show {
      display: block;
    }
  </style>
</head>

<body>

<main class="card">

  <a href="index.html">← StarRise</a>

  <h1>Reset your password</h1>

  <p>Enter your email and we'll send you a secure password-reset link.</p>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <form id="form">

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      required
    >

    <button id="btn" type="submit">
      Send Reset Link
    </button>

  </form>

  <p>
    <a href="login.html">Back to Sign In</a>
  </p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
  'https://rcnikxotdalxtuvpmlvm.supabase.co',
  'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN'
);

const form = document.getElementById('form');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

function showMessage(text) {
  msg.textContent = text;
  msg.className = 'msg show';
}

form.addEventListener('submit', async (e) => {

  e.preventDefault();

  btn.disabled = true;
  btn.textContent = 'Sending...';

  const email = document.getElementById('email').value.trim();

  const { error } = await supabase.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:
        'https://zostreet.github.io/StarRise/reset-password.html'
    }
  );

  if (error) {
    showMessage(error.message);
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
    return;
  }

  showMessage(
    'Check your email for a secure password-reset link.'
  );

  btn.textContent = 'Reset Link Sent';
});

</script>

</body>
</html>
