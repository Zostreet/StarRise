
name: Publish StarRise Vocal Pro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and publish Vocal Pro
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("studio.html").read_text(encoding="utf-8")

          required = [
              "Vocal tone presets",
              "Warm R&B",
              "Low-cut (Hz)",
          ]

          missing = [item for item in required if item not in source]

          if "De-Esser / Sibilance" not in source and "Sibilance soften" not in source:
              missing.append("De-Esser / Sibilance")

          if missing:
              raise SystemExit(
                  "Missing Vocal Pro features: " + ", ".join(missing)
              )

          Path("studio-vocal-pro.html").write_text(
              source, encoding="utf-8"
          )

          print("Vocal Pro page synchronized with Studio Pro.")
          PY

      - name: Commit published page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio-vocal-pro.html

          if git diff --cached --quiet; then
            echo "Vocal Pro page is already current."
          else
            git commit -m "Publish current StarRise Vocal Pro studio"
            git push origin HEAD:main
          fi
