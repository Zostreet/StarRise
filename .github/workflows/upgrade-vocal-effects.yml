
name: Upgrade StarRise Vocal Effects

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StarRise
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Upgrade vocal effects
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          if not path.exists():
              raise SystemExit("studio.html not found")

          source = path.read_text(encoding="utf-8")

          if "Vocal tone presets" in source:
              print("Vocal upgrade already installed.")
              raise SystemExit(0)

          def replace(old, new):
              global source
              if old not in source:
                  raise SystemExit(
                      "Expected studio code not found: "
                      + old[:65]
                  )
              source = source.replace(old, new, 1)

          replace(
              "eq:0,compression:0,reverb:0,delay:0",
              "eq:0,compression:0,reverb:0,delay:0,"
              "highpass:80,presence:0,deess:0"
          )

          replace(
              "const compressor=ac.createDynamicsCompressor();",
              """
          const highpass=ac.createBiquadFilter();
          highpass.type="highpass";
          highpass.frequency.value=track.highpass??80;
          highpass.Q.value=.707;

          const presence=ac.createBiquadFilter();
          presence.type="peaking";
          presence.frequency.value=3800;
          presence.Q.value=1.1;
          presence.gain.value=track.presence??0;

          const sibilance=ac.createBiquadFilter();
          sibilance.type="highshelf";
          sibilance.frequency.value=5700;
          sibilance.gain.value=-(track.deess??0)*.12;

          const compressor=ac.createDynamicsCompressor();
          """
          )

          replace(
              "source.connect(eq);\neq.connect(compressor);",
              """source.connect(highpass);
          highpass.connect(eq);
          eq.connect(presence);
          presence.connect(sibilance);
          sibilance.connect(compressor);"""
          )

          replace(
              'slider("EQ / Brightness",-12,12,1,"eq"),',
              '''slider("EQ / Brightness",-12,12,1,"eq"),
          slider("Low-cut (Hz)",40,180,5,"highpass"),
          slider("Presence (dB)",-6,6,1,"presence"),
          slider("Sibilance soften",0,100,5,"deess"),'''
          )

          replace(
              "row.append(fx);\n\nbox.append(row);",
              """row.append(fx);

          if(track.type==="vocal"){
            const presets=document.createElement("div");
            presets.className="controls";

            const caption=document.createElement("strong");
            caption.textContent="Vocal tone presets";
            presets.append(caption);

            const profiles={
              "Natural":{
                highpass:80,presence:0,deess:10,
                eq:0,compression:20,reverb:10,delay:0
              },
              "Warm R&B":{
                highpass:75,presence:2,deess:30,
                eq:-2,compression:40,reverb:22,delay:8
              },
              "Bright Pop":{
                highpass:100,presence:4,deess:45,
                eq:3,compression:50,reverb:18,delay:10
              },
              "Rap Lead":{
                highpass:95,presence:3,deess:40,
                eq:1,compression:60,reverb:8,delay:5
              },
              "Soft Soul":{
                highpass:70,presence:1,deess:25,
                eq:-1,compression:30,reverb:28,delay:6
              }
            };

            for(const [name,settings] of Object.entries(profiles)){
              const button=document.createElement("button");
              button.className="secondary";
              button.textContent=name;

              button.onclick=()=>{
                if(recording){
                  return status("Stop recording first.");
                }

                Object.assign(track,settings);
                renderTracks();

                status(
                  name+" vocal preset applied. "
                  +"Press Play Session to hear it."
                );
              };

              presets.append(button);
            }

            row.append(presets);
          }

          box.append(row);"""
          )

          replace(
              "eq:t.eq,compression:t.compression,"
              "reverb:t.reverb,delay:t.delay",
              "eq:t.eq,compression:t.compression,"
              "reverb:t.reverb,delay:t.delay,"
              "highpass:t.highpass??80,"
              "presence:t.presence??0,"
              "deess:t.deess??0"
          )

          replace(
              'reverb:projectNumber(t.reverb,"reverb",0,100),'
              'delay:projectNumber(t.delay,"delay",0,100)',
              '''reverb:projectNumber(t.reverb,"reverb",0,100),
          delay:projectNumber(t.delay,"delay",0,100),
          highpass:projectNumber(t.highpass??80,"low-cut",40,180),
          presence:projectNumber(t.presence??0,"presence",-6,6),
          deess:projectNumber(t.deess??0,"sibilance soften",0,100)'''
          )

          replace(
              "Each track has independent volume, pan, "
              "EQ, compression, reverb and delay.",
              "Each track has independent volume, pan, "
              "low-cut, EQ, presence, sibilance softening, "
              "compression, reverb and delay. "
              "Vocal tracks also have tone presets."
          )

          replace(
              "This version does not yet include automatic pitch correction,",
              "This version includes vocal tone presets "
              "but not automatic pitch correction,"
          )

          path.write_text(source, encoding="utf-8")
          print("StarRise Vocal Pro upgraded successfully.")
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("studio.html").read_text()
          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              source,
              flags=re.S | re.I
          )

          if not scripts:
              raise SystemExit("No studio JavaScript found")

          Path("/tmp/starrise-studio.js").write_text(
              "\n".join(scripts)
          )
          PY
          node --check /tmp/starrise-studio.js

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Upgrade StarRise vocal effects"
            git push
          fi
