
name: Upgrade StarRise Touch Timeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Touch Timeline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          html = path.read_text(encoding="utf-8")

          marker = "STARRISE_TOUCH_TIMELINE_V1"

          if marker in html:
              print("Touch timeline already installed.")
              raise SystemExit(0)

          old = """rail.append(bar);lane.append(name,rail);box.append(lane);"""

          if old not in html:
              raise SystemExit("Timeline insertion point missing.")

          new = """
          // STARRISE_TOUCH_TIMELINE_V1
          bar.style.touchAction = "none";
          bar.style.cursor = "grab";
          bar.setAttribute("role", "slider");
          bar.setAttribute("tabindex", "0");
          bar.setAttribute("aria-label",
            "Move " + track.name + " in song");
          bar.setAttribute("aria-valuemin", "0");
          bar.setAttribute("aria-valuenow",
            String(track.offset));
          bar.setAttribute("aria-valuetext",
            track.offset.toFixed(2) + " seconds");

          let dragging = false;
          let pointerStart = 0;
          let originalOffset = 0;
          let proposedOffset = 0;

          bar.addEventListener("pointerdown", event => {
            if (!canEditTrack()) return;

            dragging = true;
            pointerStart = event.clientX;
            originalOffset = track.offset;
            proposedOffset = originalOffset;

            bar.setPointerCapture(event.pointerId);
            bar.style.cursor = "grabbing";
            event.preventDefault();
          });

          bar.addEventListener("pointermove", event => {
            if (!dragging) return;

            const width = rail.getBoundingClientRect().width;
            if (width <= 0) return;

            const delta =
              (event.clientX - pointerStart) / width * end;

            proposedOffset =
              Math.max(0, originalOffset + delta);

            bar.style.left =
              (proposedOffset / end * 100) + "%";

            bar.setAttribute("aria-valuenow",
              proposedOffset.toFixed(2));
            bar.setAttribute("aria-valuetext",
              proposedOffset.toFixed(2) + " seconds");
          });

          bar.addEventListener("pointerup", event => {
            if (!dragging) return;
            dragging = false;
            bar.style.cursor = "grab";

            if (bar.hasPointerCapture(event.pointerId)) {
              bar.releasePointerCapture(event.pointerId);
            }

            if (Math.abs(proposedOffset - originalOffset) > 0.01) {
              editTrack(track, {
                name: track.name,
                offset: Number(proposedOffset.toFixed(3)),
                trimStart: track.trimStart,
                trimEnd: track.trimEnd
              });
            } else {
              renderArrangement();
            }
          });

          bar.addEventListener("pointercancel", () => {
            dragging = false;
            renderArrangement();
          });

          bar.addEventListener("keydown", event => {
            if (!["ArrowLeft", "ArrowRight"].includes(event.key)) {
              return;
            }

            event.preventDefault();

            const delta =
              event.key === "ArrowRight" ? 0.5 : -0.5;

            editTrack(track, {
              name: track.name,
              offset: Math.max(0, track.offset + delta),
              trimStart: track.trimStart,
              trimEnd: track.trimEnd
            });
          });

          rail.append(bar);
          lane.append(name,rail);
          box.append(lane);
          """

          html = html.replace(old, new, 1)

          css = """
          <style>
          /* STARRISE_TOUCH_TIMELINE_STYLE */
          .arrangement-rail {
            overflow: visible;
          }

          .arrangement-clip {
            touch-action: none;
            user-select: none;
            cursor: grab;
          }

          .arrangement-clip:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
          }
          </style>
          """

          if "</head>" not in html:
              raise SystemExit("HTML head not found.")

          html = html.replace("</head>", css + "</head>", 1)

          path.write_text(html, encoding="utf-8")
          print("Touch timeline installed successfully.")
          PY

      - name: Commit Upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if ! git diff --cached --quiet; then
            git commit -m "Add touch-based StarRise audio timeline"
            git push
          fi
