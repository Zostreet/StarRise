
name: Upgrade StarRise Studio Vocal FX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starrise-studio-vocal-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade and test Studio Pro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StarRise
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install safe track type selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          html = path.read_text(encoding="utf-8")

          marker = "STARRISE_TRACK_TYPE_SELECTOR_V2"

          if marker in html:
              print("Upgrade already installed.")
          else:
              anchor = '''row.append(fx);

          const comparison=document.createElement("div");'''

              replacement = '''row.append(fx);

          // STARRISE_TRACK_TYPE_SELECTOR_V2
          const typeControls=document.createElement("div");
          typeControls.className="controls";

          const typeLabel=document.createElement("label");
          typeLabel.textContent="Track Type";

          const typeSelect=document.createElement("select");

          [
            ["audio","Audio / Instrument"],
            ["vocal","Vocal Recording"]
          ].forEach(([value,label])=>{
            const option=document.createElement("option");
            option.value=value;
            option.textContent=label;
            option.selected=(
              value===(track.type==="vocal"?"vocal":"audio")
            );
            typeSelect.append(option);
          });

          typeSelect.onchange=(event)=>{
            if(recording){
              status("Stop recording before changing track type.");
              renderTracks();
              return;
            }

            const selected=event.target.value;

            if(selected!=="audio" && selected!=="vocal"){
              return;
            }

            track.type=selected;
            renderTracks();

            status(
              selected==="vocal"
                ?"Vocal tools enabled. Save Project to keep this setting."
                :"Audio track mode enabled. Save Project to keep this setting."
            );
          };

          typeLabel.append(typeSelect);
          typeControls.append(typeLabel);
          row.append(typeControls);

          const comparison=document.createElement("div");'''

              if html.count(anchor)!=1:
                  raise SystemExit(
                      "Studio mixer anchor mismatch. "
                      "No files changed."
                  )

              html=html.replace(anchor,replacement,1)
              path.write_text(html,encoding="utf-8")
              print("Track type selector installed.")

          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate website
        run: node scripts/validate-site.mjs

      - name: Test Studio and creator features
        run: |
          node --test \
            creator-studio.test.cjs \
            studio-pro.test.cjs \
            studio-sounds.test.cjs \
            studio-projects.test.cjs \
            tests/launch-paths.test.cjs

      - name: Test PayPal safety
        run: |
          node --experimental-strip-types \
            --test tests/paypal-payment.test.mjs

      - name: Commit verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if ! git diff --cached --quiet; then
            git commit -m "Fix Studio Pro vocal track selector"
            git push origin HEAD:main
          else
            echo "Upgrade already installed."
          fi
