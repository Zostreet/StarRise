
name: Upgrade StarRise Clip Editor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Split and Move Tools
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          html = path.read_text(encoding="utf-8")

          marker = "STARRISE_CLIP_EDITOR_V2"

          if marker in html:
              print("Clip Editor already installed.")
              raise SystemExit(0)

          anchor = "function duplicateTrack(track){"

          if anchor not in html:
              raise SystemExit("Track editor not found.")

          upgrade = """
          // STARRISE_CLIP_EDITOR_V2

          function splitAudioTrack(track, seconds) {
            if (!canEditTrack()) return;

            try {
              const clip = clipRange(track);
              const split = Number(seconds);

              if (
                !Number.isFinite(split) ||
                split <= 0 ||
                split >= clip.duration
              ) {
                status(
                  "Choose a split point inside the clip."
                );
                return;
              }

              const rate = track.buffer.sampleRate;
              const splitFrame =
                clip.first + Math.round(split * rate);

              if (
                splitFrame <= clip.first ||
                splitFrame >= clip.last
              ) {
                status("Split point is outside the clip.");
                return;
              }

              const splitTime = splitFrame / rate;
              const index = tracks.indexOf(track);

              if (index < 0) return;

              const original = {
                ...track
              };

              const second = {
                ...track,
                id: nextTrackId++,
                name: track.name + " Part 2",
                offset:
                  track.offset +
                  (splitFrame - clip.first) / rate,
                trimStart: splitTime,
                trimEnd: track.trimEnd
              };

              track.name = track.name + " Part 1";
              track.trimEnd = splitTime;

              tracks.splice(index + 1, 0, second);

              rememberTrackEdit({
                kind: "split",
                id: track.id,
                secondId: second.id,
                before: original
              });

              renderTracks();

              status(
                "Clip split successfully. " +
                "Original audio preserved. " +
                "Save Project to keep changes."
              );

            } catch (error) {
              status(
                "Split failed: " + error.message
              );
            }
          }

          function moveAudioTrack(track, seconds) {
            if (!canEditTrack()) return;

            const position = Number(seconds);

            if (
              !Number.isFinite(position) ||
              position < 0
            ) {
              status("Enter a valid start time.");
              return;
            }

            editTrack(track, {
              name: track.name,
              offset: position,
              trimStart: track.trimStart,
              trimEnd: track.trimEnd
            });
          }

          """

          html = html.replace(
              anchor,
              upgrade + anchor,
              1
          )

          old = (
              "editor.append(apply,restore);"
              "row.append(editor);"
          )

          new = """
          editor.append(apply,restore);

          const clipTools =
            document.createElement("div");

          clipTools.className = "trackedit";

          const splitLabel =
            document.createElement("label");

          splitLabel.textContent =
            "Split at seconds into clip";

          const splitInput =
            document.createElement("input");

          splitInput.type = "number";
          splitInput.min = "0";
          splitInput.step = "0.01";
          splitInput.value =
            (clip.duration / 2).toFixed(2);

          splitLabel.append(splitInput);

          const splitButton =
            document.createElement("button");

          splitButton.type = "button";
          splitButton.textContent = "Split Clip";

          splitButton.onclick = () => {
            splitAudioTrack(
              track,
              splitInput.value
            );
          };

          const moveLabel =
            document.createElement("label");

          moveLabel.textContent =
            "Move Clip To (seconds)";

          const moveInput =
            document.createElement("input");

          moveInput.type = "number";
          moveInput.min = "0";
          moveInput.step = "0.01";
          moveInput.value = track.offset;

          moveLabel.append(moveInput);

          const moveButton =
            document.createElement("button");

          moveButton.type = "button";
          moveButton.textContent = "Move Clip";

          moveButton.onclick = () => {
            moveAudioTrack(
              track,
              moveInput.value
            );
          };

          clipTools.append(
            splitLabel,
            splitButton,
            moveLabel,
            moveButton
          );

          editor.append(clipTools);
          row.append(editor);
          """

          if old not in html:
              raise SystemExit(
                  "Track editor insertion point missing."
              )

          html = html.replace(old, new, 1)

          undo_anchor = (
              'if(edit.kind==="add")'
              'tracks=tracks.filter(t=>t.id!==edit.id);'
          )

          undo_upgrade = """
          if (edit.kind === "split") {
            tracks = tracks.filter(
              t => t.id !== edit.secondId
            );

            const originalTrack = tracks.find(
              t => t.id === edit.id
            );

            if (originalTrack) {
              Object.assign(
                originalTrack,
                edit.before
              );
            }
          }

          """

          if undo_anchor not in html:
              raise SystemExit(
                  "Undo integration point missing."
              )

          html = html.replace(
              undo_anchor,
              undo_upgrade + undo_anchor,
              1
          )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print(
              "StarRise Clip Editor V2 installed."
          )
          PY

      - name: Commit Upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if ! git diff --cached --quiet; then
            git commit -m "Upgrade StarRise audio clip editor"
            git push
          fi
