
name: Publish StarRise Vocal Pro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out StarRise
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Upgrade recording studio
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          source = path.read_text(encoding="utf-8")

          if "Vocal Pro · Low Cut" in source:
              print("Vocal Pro already installed.")
              raise SystemExit(0)

          def replace(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Expected one matching section, found {count}: "
                      + old[:65]
                  )
              source = source.replace(old, new, 1)

          replace(
              "eq:0,compression:0,reverb:0,delay:0",
              """eq:0,compression:0,reverb:0,delay:0,
          vocalLowCut:0,vocalPresence:0,
          vocalDeEss:0,vocalWarmth:0"""
          )

          replace(
              "source.connect(eq);\neq.connect(compressor);",
              """let vocalInput=source;

          if(track.type==="vocal"){
            if((track.vocalLowCut||0)>0){
              const filter=ac.createBiquadFilter();
              filter.type="highpass";
              filter.frequency.value=
                65+(track.vocalLowCut/100)*175;
              vocalInput.connect(filter);
              vocalInput=filter;
            }

            if((track.vocalPresence||0)>0){
              const presence=ac.createBiquadFilter();
              presence.type="peaking";
              presence.frequency.value=3200;
              presence.Q.value=.85;
              presence.gain.value=
                track.vocalPresence/100*6;
              vocalInput.connect(presence);
              vocalInput=presence;
            }

            if((track.vocalDeEss||0)>0){
              const deEss=ac.createBiquadFilter();
              deEss.type="highshelf";
              deEss.frequency.value=5800;
              deEss.gain.value=
                -track.vocalDeEss/100*9;
              vocalInput.connect(deEss);
              vocalInput=deEss;
            }

            if((track.vocalWarmth||0)>0){
              const warmth=ac.createWaveShaper();
              const drive=1+
                track.vocalWarmth/100*4;
              const curve=new Float32Array(4096);

              for(let i=0;i<curve.length;i++){
                const x=i*2/(curve.length-1)-1;
                curve[i]=
                  Math.tanh(drive*x)/Math.tanh(drive);
              }

              warmth.curve=curve;
              warmth.oversample="2x";
              vocalInput.connect(warmth);
              vocalInput=warmth;
            }
          }

          vocalInput.connect(eq);
          eq.connect(compressor);"""
          )

          replace(
              "row.append(fx);\n\nbox.append(row);",
              """if(track.type==="vocal"){
            const vocalPro=document.createElement("div");
            vocalPro.className="fx controls";

            const heading=document.createElement("strong");
            heading.textContent=
              "Vocal Pro · Low Cut / Presence / Sibilance / Warmth";

            vocalPro.append(
              heading,
              slider("Low Cut",0,100,5,"vocalLowCut"),
              slider("Presence",0,100,5,"vocalPresence"),
              slider("Sibilance Reduction",0,100,5,"vocalDeEss"),
              slider("Warmth",0,100,5,"vocalWarmth")
            );

            row.append(vocalPro);
          }

          row.append(fx);

          box.append(row);"""
          )

          replace(
              """eq:t.eq,compression:t.compression,reverb:t.reverb,delay:t.delay""",
              """eq:t.eq,compression:t.compression,
          reverb:t.reverb,delay:t.delay,
          vocalLowCut:t.vocalLowCut??0,
          vocalPresence:t.vocalPresence??0,
          vocalDeEss:t.vocalDeEss??0,
          vocalWarmth:t.vocalWarmth??0"""
          )

          replace(
              """reverb:projectNumber(t.reverb,"reverb",0,100),delay:projectNumber(t.delay,"delay",0,100)""",
              """reverb:projectNumber(t.reverb,"reverb",0,100),
          delay:projectNumber(t.delay,"delay",0,100),
          vocalLowCut:projectNumber(
            t.vocalLowCut??0,"vocal low cut",0,100),
          vocalPresence:projectNumber(
            t.vocalPresence??0,"vocal presence",0,100),
          vocalDeEss:projectNumber(
            t.vocalDeEss??0,"vocal de-ess",0,100),
          vocalWarmth:projectNumber(
            t.vocalWarmth??0,"vocal warmth",0,100)"""
          )

          replace(
              "Each track has independent volume, pan, EQ, compression, reverb and delay. Mix changes apply on the next playback and to new exports.",
              "Each track has independent volume, pan, EQ, compression, reverb and delay. Vocal tracks also include Vocal Pro effects. Changes apply on the next playback and to new exports."
          )

          path.write_text(source, encoding="utf-8")
          print("Vocal Pro upgrade applied successfully.")
          PY

      - name: Validate studio JavaScript
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          html = Path("studio.html").read_text()
          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              html,
              flags=re.S | re.I
          )

          if not scripts:
              raise RuntimeError("No studio JavaScript found")

          Path("/tmp/starrise-studio.js").write_text(
              "\n".join(scripts)
          )
          PY

          node --check /tmp/starrise-studio.js

      - name: Commit upgrade
        shell: bash
        run: |
          if git diff --quiet -- studio.html; then
            echo "Studio is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html
          git commit -m "Publish StarRise Vocal Pro effects"
          git push
