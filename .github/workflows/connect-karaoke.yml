
name: Connect StarRise Karaoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/connect-karaoke.yml"

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Connect all karaoke pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          links = {
              "index.html": [
                  ("karaoke.html", "Karaoke Studio"),
                  ("karaoke-battles.html", "Karaoke Battles")
              ],
              "dashboard.html": [
                  ("karaoke.html", "Karaoke Studio"),
                  ("karaoke-battles.html", "Karaoke Battles"),
                  ("my-karaoke.html", "My Performances")
              ],
              "karaoke.html": [
                  ("karaoke-battles.html", "Karaoke Battles")
              ],
              "my-karaoke.html": [
                  ("karaoke-battles.html", "Karaoke Battles")
              ]
          }

          anchors = {
              "index.html": '<a href="battle-rap.html">Battle Rap</a>',
              "dashboard.html": '<div class="header-actions">',
              "karaoke.html": '<a class="btn" href="my-karaoke.html">My Performances</a>',
              "my-karaoke.html": '<a href="dashboard.html">Dashboard</a>'
          }

          for filename, items in links.items():
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              anchor = anchors[filename]

              if anchor not in content:
                  raise RuntimeError(
                      f"Navigation location missing: {filename}"
                  )

              additions = []

              for url, title in items:
                  if f'href="{url}"' in content:
                      print(f"Already linked: {filename} -> {url}")
                      continue

                  css = (
                      ' class="header-button"'
                      if filename == "dashboard.html"
                      else ' class="btn"'
                      if filename == "karaoke.html"
                      else ""
                  )

                  additions.append(
                      f'<a{css} href="{url}">{title}</a>'
                  )

              if not additions:
                  continue

              new_links = "\n".join(additions)

              if filename == "dashboard.html":
                  replacement = anchor + "\n" + new_links
              else:
                  replacement = anchor + "\n" + new_links

              content = content.replace(
                  anchor, replacement, 1
              )

              path.write_text(
                  content, encoding="utf-8"
              )

              print(f"Updated: {filename}")

          print("All Karaoke navigation links checked.")
          PY

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard.html karaoke.html my-karaoke.html

          if git diff --cached --quiet; then
            echo "Everything already connected."
            exit 0
          fi

          git commit -m "Complete StarRise Karaoke integration"
          git push origin HEAD:main
