
name: Fix StarRise Waveform Drag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-waveform-drag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StarRise
        uses: actions/checkout@v4

      - name: Add mobile waveform dragging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          html = path.read_text(encoding="utf-8")

          marker = "STARRISE_WAVEFORM_TOUCH_DRAG_V2"

          if marker in html:
              print("Waveform dragging already installed.")
              raise SystemExit(0)

          old = '''drawWave(canvas,track.buffer,clip.first,clip.last);

          row.append(head,canvas);'''

          new = '''drawWave(canvas,track.buffer,clip.first,clip.last);

          // STARRISE_WAVEFORM_TOUCH_DRAG_V2
          canvas.style.touchAction = "pan-y";
          canvas.style.cursor = "grab";
          canvas.style.userSelect = "none";

          canvas.setAttribute("role", "slider");
          canvas.setAttribute("tabindex", "0");
          canvas.setAttribute("aria-label",
            "Move " + track.name + " left or right");

          const dragHelp = document.createElement("small");
          dragHelp.textContent =
            "Drag waveform left or right to move this clip.";
          dragHelp.style.display = "block";

          let waveDrag = null;

          canvas.addEventListener("pointerdown", event => {
            if (event.button !== 0 || !canEditTrack()) return;

            waveDrag = {
              id: event.pointerId,
              x: event.clientX,
              y: event.clientY,
              origin: track.offset,
              next: track.offset,
              active: false
            };
          });

          canvas.addEventListener("pointermove", event => {
            if (!waveDrag ||
                waveDrag.id !== event.pointerId) return;

            const dx = event.clientX - waveDrag.x;
            const dy = event.clientY - waveDrag.y;

            if (!waveDrag.active) {
              if (Math.abs(dx) < 7) return;

              if (Math.abs(dy) > Math.abs(dx)) {
                waveDrag = null;
                return;
              }

              waveDrag.active = true;
              canvas.style.touchAction = "none";
              canvas.setPointerCapture(event.pointerId);
            }

            const width =
              Math.max(1, canvas.getBoundingClientRect().width);

            const secondsPerPixel =
              Math.max(30, sessionDuration()) / width;

            waveDrag.next = Math.max(
              0,
              waveDrag.origin + dx * secondsPerPixel
            );

            canvas.style.transform =
              "translateX(" +
              ((waveDrag.next - waveDrag.origin) /
                secondsPerPixel) +
              "px)";

            canvas.style.opacity = ".7";
            canvas.style.cursor = "grabbing";

            event.preventDefault();
          });

          function finishWaveDrag(event, canceled) {
            if (!waveDrag ||
                waveDrag.id !== event.pointerId) return;

            const drag = waveDrag;
            waveDrag = null;

            if (canvas.hasPointerCapture(event.pointerId)) {
              canvas.releasePointerCapture(event.pointerId);
            }

            canvas.style.transform = "";
            canvas.style.opacity = "";
            canvas.style.cursor = "grab";
            canvas.style.touchAction = "pan-y";

            if (!canceled &&
                drag.active &&
                Math.abs(drag.next - drag.origin) > .01) {
              editTrack(track, {
                name: track.name,
                offset: Number(drag.next.toFixed(3)),
                trimStart: track.trimStart,
                trimEnd: track.trimEnd
              });
            }
          }

          canvas.addEventListener("pointerup",
            event => finishWaveDrag(event, false));

          canvas.addEventListener("pointercancel",
            event => finishWaveDrag(event, true));

          canvas.addEventListener("keydown", event => {
            if (event.key !== "ArrowLeft" &&
                event.key !== "ArrowRight") return;

            event.preventDefault();
            if (!canEditTrack()) return;

            editTrack(track, {
              name: track.name,
              offset: Math.max(
                0,
                track.offset +
                  (event.key === "ArrowRight" ? .5 : -.5)
              ),
              trimStart: track.trimStart,
              trimEnd: track.trimEnd
            });
          });

          row.append(head,canvas,dragHelp);'''

          if old not in html:
              raise SystemExit(
                "STOP: Expected waveform code not found. "
                "Studio left unchanged."
              )

          html = html.replace(old, new, 1)
          path.write_text(html, encoding="utf-8")
          print("Waveform drag controls installed.")
          PY

      - name: Commit studio fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix mobile audio waveform dragging"
            git push
          fi
