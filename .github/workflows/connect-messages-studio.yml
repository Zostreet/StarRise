
name: Repair StarRise Studio Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Repair and test Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StarRise
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix Studio browser compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          html = path.read_text(encoding="utf-8")

          old = '''if (
            new URLSearchParams(location.search)
              .get("import") === "message"
          ) {
            setTimeout(importSharedMessageAudio, 250);
          }'''

          new = '''if (
            typeof location !== "undefined" &&
            typeof URLSearchParams !== "undefined" &&
            new URLSearchParams(location.search)
              .get("import") === "message"
          ) {
            setTimeout(importSharedMessageAudio, 250);
          }'''

          if old not in html:
              raise SystemExit(
                  "Studio import guard not found. No changes made."
              )

          updated = html.replace(old, new, 1)

          path.write_text(
              updated,
              encoding="utf-8"
          )

          print("Studio browser compatibility repaired.")
          PY

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Validate site
        run: node scripts/validate-site.mjs

      - name: Test Studio and creator features
        run: |
          node --test \
            creator-studio.test.cjs \
            studio-pro.test.cjs \
            studio-sounds.test.cjs \
            studio-projects.test.cjs \
            tests/launch-paths.test.cjs

      - name: Test PayPal safety
        run: |
          node --experimental-strip-types \
            --test tests/paypal-payment.test.mjs

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if ! git diff --cached --quiet; then
            git commit -m "Fix Studio import browser compatibility"
            git push origin HEAD:main
          fi
