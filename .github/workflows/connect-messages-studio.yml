
name: Connect Messages to Studio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StarRise
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install complete Messages and Studio integration
        shell: bash
        run: |
          cat > /tmp/connect_studio.py <<'PY'
          from pathlib import Path
          import re

          messages_path = Path("messages.html")
          studio_path = Path("studio.html")

          messages = messages_path.read_text(encoding="utf-8")
          studio = studio_path.read_text(encoding="utf-8")

          # Add a Send to Studio button to audio attachments.
          if 'class="sr-send-studio"' not in messages:
              pattern = (
                  r"(else if\(type\.startsWith\('audio/'\)\)\{)"
                  r"(.*?)"
                  r"(\}\s*else if\(type\.startsWith\('video/'\)\))"
              )

              match = re.search(pattern, messages, re.S)
              if not match:
                  raise RuntimeError(
                      "Audio attachment renderer not found. "
                      "No files were changed."
                  )

              audio_branch = match.group(2)

              audio_branch += """
                  attachmentHtml +=
                    '<button type="button" class="sr-send-studio" ' +
                    'data-audio-path="' + safe(m.attachment_path) + '" ' +
                    'data-audio-name="' +
                    safe(m.attachment_name || 'Shared audio') + '">' +
                    'Send to Studio</button>';
              """

              messages = (
                  messages[:match.start(2)]
                  + audio_branch
                  + messages[match.end(2):]
              )

          # Store the audio in IndexedDB before opening Studio.
          if "STARRISE_STUDIO_TRANSFER_HANDLER" not in messages:
              handler = r"""
          // STARRISE_STUDIO_TRANSFER_HANDLER
          document.addEventListener("click", async function(event) {
            const button = event.target.closest(".sr-send-studio");
            if (!button) return;

            const path = button.dataset.audioPath;
            const name = button.dataset.audioName || "Shared audio";

            if (!path) {
              alert("Audio attachment not found.");
              return;
            }

            if (
              typeof activeConversationId !== "undefined" &&
              activeConversationId &&
              !path.startsWith(activeConversationId + "/")
            ) {
              alert("This attachment is not in the active conversation.");
              return;
            }

            button.disabled = true;
            const previousText = button.textContent;
            button.textContent = "Sending...";

            try {
              const { data, error } = await client.storage
                .from("message-attachments")
                .download(path);

              if (error) throw error;
              if (!data) throw new Error("Audio download failed.");

              const bytes = await data.arrayBuffer();

              const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open(
                  "starrise-studio-transfer", 1
                );

                request.onupgradeneeded = () => {
                  const database = request.result;
                  if (!database.objectStoreNames.contains("audio")) {
                    database.createObjectStore("audio");
                  }
                };

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });

              await new Promise((resolve, reject) => {
                const tx = db.transaction("audio", "readwrite");
                tx.objectStore("audio").put(
                  {
                    name,
                    bytes,
                    createdAt: Date.now()
                  },
                  "incoming"
                );

                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
              });

              db.close();
              location.href = "studio.html?import=message";

            } catch (error) {
              console.error("Send to Studio failed:", error);
              alert(
                "Unable to send audio to Studio: " +
                (error.message || error)
              );
              button.disabled = false;
              button.textContent = previousText;
            }
          });
          """

              marker = "initialize();\n\n})();"

              if marker not in messages:
                  raise RuntimeError(
                      "Messaging initialization marker not found."
                  )

              messages = messages.replace(
                  marker,
                  handler + "\n" + marker,
                  1
              )

          # Import the transferred audio as a real Studio track.
          if "STARRISE_STUDIO_TRANSFER_IMPORT" not in studio:
              importer = r"""
          // STARRISE_STUDIO_TRANSFER_IMPORT
          async function importSharedMessageAudio() {
            const params = new URLSearchParams(location.search);
            if (params.get("import") !== "message") return;

            try {
              const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open(
                  "starrise-studio-transfer", 1
                );

                request.onupgradeneeded = () => {
                  const database = request.result;
                  if (!database.objectStoreNames.contains("audio")) {
                    database.createObjectStore("audio");
                  }
                };

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });

              const item = await new Promise((resolve, reject) => {
                const tx = db.transaction("audio", "readonly");
                const request = tx.objectStore("audio").get("incoming");

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });

              if (!item || !item.bytes) {
                throw new Error("No shared audio was found.");
              }

              const ac = await ready();
              const buffer = await ac.decodeAudioData(
                item.bytes.slice(0)
              );

              makeTrack(
                item.name || "Shared audio",
                buffer,
                "audio"
              );

              await new Promise((resolve, reject) => {
                const tx = db.transaction("audio", "readwrite");
                tx.objectStore("audio").delete("incoming");

                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
              });

              db.close();

              history.replaceState(
                null,
                "",
                location.pathname
              );

              status("Shared audio imported into Studio.");

            } catch (error) {
              console.error("Studio import failed:", error);
              status(
                "Shared audio import failed: " +
                (error.message || error)
              );
            }
          }

          if (
            new URLSearchParams(location.search)
              .get("import") === "message"
          ) {
            setTimeout(importSharedMessageAudio, 250);
          }
          """

              marker = '$("audioUpload").onchange=async event=>{'

              if marker not in studio:
                  raise RuntimeError(
                      "Studio audio upload handler not found."
                  )

              studio = studio.replace(
                  marker,
                  importer + "\n" + marker,
                  1
              )

          messages_path.write_text(
              messages, encoding="utf-8"
          )
          studio_path.write_text(
              studio, encoding="utf-8"
          )

          print("Messages and Studio integration installed.")
          PY

          python /tmp/connect_studio.py

      - name: Commit complete replacement files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add messages.html studio.html

          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Connect private audio messages to Studio Pro"
            git push origin HEAD:main
          fi
