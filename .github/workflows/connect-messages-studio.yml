
name: Repair StarRise Studio Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair Studio browser guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          html = path.read_text(encoding="utf-8")

          old = """if (
            new URLSearchParams(location.search)
              .get("import") === "message"
          ) {
            setTimeout(importSharedMessageAudio, 250);
          }"""

          new = """if (
            typeof location !== "undefined" &&
            typeof URLSearchParams !== "undefined" &&
            new URLSearchParams(location.search)
              .get("import") === "message"
          ) {
            setTimeout(importSharedMessageAudio, 250);
          }"""

          if old not in html:
              raise SystemExit(
                  "Expected Studio import code not found."
              )

          path.write_text(
              html.replace(old, new, 1),
              encoding="utf-8"
          )
          PY

      - name: Run all Studio tests
        run: |
          npm ci --ignore-scripts
          node --test creator-studio.test.cjs studio-pro.test.cjs studio-sounds.test.cjs studio-projects.test.cjs tests/launch-paths.test.cjs

      - name: Commit tested repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if ! git diff --cached --quiet; then
            git commit -m "Fix Studio import initialization in test environments"
            git push origin HEAD:main
          fi
