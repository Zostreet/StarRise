
name: Repair StarRise Studio Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Repair and test Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StarRise
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair Studio audio import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          html = path.read_text(encoding="utf-8")

          old_function = '''async function importSharedMessageAudio() {
            const params = new URLSearchParams(location.search);
            if (params.get("import") !== "message") return;'''

          new_function = '''async function importSharedMessageAudio() {
            if (
              typeof location === "undefined" ||
              typeof URLSearchParams === "undefined"
            ) return;

            const params = new URLSearchParams(location.search);
            if (params.get("import") !== "message") return;'''

          if old_function in html:
              html = html.replace(
                  old_function,
                  new_function,
                  1
              )
              print("Audio import function repaired.")
          elif new_function in html:
              print("Audio import function already repaired.")
          else:
              raise SystemExit(
                  "Audio import function not found. "
                  "No changes committed."
              )

          old_guard = '''if (
            new URLSearchParams(location.search)
              .get("import") === "message"
          ) {
            setTimeout(importSharedMessageAudio, 250);
          }'''

          new_guard = '''if (
            typeof location !== "undefined" &&
            typeof URLSearchParams !== "undefined" &&
            new URLSearchParams(location.search)
              .get("import") === "message"
          ) {
            setTimeout(importSharedMessageAudio, 250);
          }'''

          if old_guard in html:
              html = html.replace(
                  old_guard,
                  new_guard,
                  1
              )
              print("Startup import guard repaired.")
          elif new_guard in html:
              print("Startup import guard already repaired.")
          else:
              raise SystemExit(
                  "Startup import guard not found. "
                  "No changes committed."
              )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print("Studio repair prepared.")
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate website
        run: node scripts/validate-site.mjs

      - name: Test Studio and creator features
        run: |
          node --test \
            creator-studio.test.cjs \
            studio-pro.test.cjs \
            studio-sounds.test.cjs \
            studio-projects.test.cjs \
            tests/launch-paths.test.cjs

      - name: Verify PayPal safety
        run: |
          node --experimental-strip-types \
            --test tests/paypal-payment.test.mjs

      - name: Commit tested repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if ! git diff --cached --quiet; then
            git commit -m "Fix Studio audio import test compatibility"
            git push origin HEAD:main
          else
            echo "Studio already repaired."
          fi
