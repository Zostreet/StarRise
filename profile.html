<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StarRise Member Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080812;
      color: white;
      line-height: 1.6;
    }

    header {
      padding: 24px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 60px 6%;
    }

    .profile {
      text-align: center;
      padding: 45px 20px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
    }

    .avatar {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      font-size: 48px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 60px);
    }

    .role {
      color: #ccc;
      font-size: 18px;
    }

    .location {
      color: #999;
      margin-top: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      padding: 28px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
    }

    .card h2 {
      margin-bottom: 12px;
    }

    .card p {
      color: #bbb;
      white-space: pre-wrap;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 11px 22px;
      border-radius: 25px;
      background: white;
      color: #080812;
      text-decoration: none;
      font-weight: bold;
    }

    #status {
      text-align: center;
      margin: 25px 0;
      color: #aaa;
    }

    .error {
      color: #ffaaaa !important;
    }

    footer {
      margin-top: 40px;
      padding: 35px;
      text-align: center;
      color: #999;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>

<body>

<header>
  <div class="logo">⭐ StarRise</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="members.html">Members</a>
    <a href="ecosystem.html">Ecosystem</a>
  </nav>
</header>

<main>

  <div id="status">
    Loading StarRise member...
  </div>

  <section class="profile">

    <div
      class="avatar"
      id="avatar"
    >
      ⭐
    </div>

    <h1 id="displayName">
      StarRise Member
    </h1>

    <div
      class="role"
      id="role"
    ></div>

    <div
      class="location"
      id="location"
    ></div>

  </section>

  <div class="grid">

    <section class="card">
      <h2>About</h2>

      <p id="bio">
        Loading...
      </p>
    </section>

    <section class="card">
      <h2>Connect</h2>

      <p id="websiteText">
        No website provided.
      </p>

      <a
        id="website"
        class="button"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        style="display:none;"
      >
        Visit Website
      </a>
    </section>

  </div>

</main>

<footer>
  ⭐ StarRise — Where Talent Rises.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient =
  window.supabase.createClient(
    'https://rcnikxotdalxtuvpmlvm.supabase.co',
    'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN'
  );


async function loadProfile() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get('id');


  if (!id) {

    showError(
      'No member ID was provided.'
    );

    return;
  }


  console.log(
    'StarRise profile ID:',
    id
  );


  const result =
    await supabaseClient
      .from('public_profiles')
      .select(
  'id, display_name, role, location, bio, website, avatar_url'
)
      .eq('id', id)
      .maybeSingle();


  console.log(
    'StarRise profile result:',
    result
  );


  if (result.error) {

    console.error(
      'Supabase error:',
      result.error
    );

    showError(
      'Unable to load this member profile.'
    );

    return;
  }


  if (!result.data) {

    showError(
      'No StarRise profile was found for this member.'
    );

    return;
  }


  const member =
    result.data;


  const name =
    member.display_name ||
    'StarRise Member';


  document
    .getElementById('displayName')
    .textContent =
      name;


  const avatar =
  document.getElementById('avatar');

if (member.avatar_url) {

  avatar.innerHTML = `
    <img
      src="${member.avatar_url}"
      alt="${name}"
      style="
        width:100%;
        height:100%;
        object-fit:cover;
        border-radius:50%;
      "
    >
  `;

} else {

  avatar.textContent =
    name.charAt(0).toUpperCase();

}

  document
    .getElementById('role')
    .textContent =
      member.role ||
      'Member';


  document
    .getElementById('location')
    .textContent =
      member.location ||
      '';


  document
    .getElementById('bio')
    .textContent =
      member.bio ||
      'This member has not added a bio yet.';


  if (
    member.website &&
    member.website.trim()
  ) {

    document
      .getElementById('websiteText')
      .textContent =
        member.website;


    const link =
      document.getElementById(
        'website'
      );


    link.href =
      member.website;


    link.style.display =
      'inline-block';
  }


  document
    .getElementById('status')
    .textContent =
      'StarRise member profile';


  document.title =
    name +
    ' | StarRise';

}


function showError(message) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    message;


  status.classList.add(
    'error'
  );

}


loadProfile();

</script>

</body>

</html>
