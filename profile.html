<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>StarRise Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080812;
      color: #fff;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid #ffffff18;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
    }

    main {
      width: min(850px, calc(100% - 40px));
      margin: 50px auto;
    }

    .panel {
      border: 1px solid #ffffff18;
      border-radius: 22px;
      background: #ffffff08;
      padding: 30px;
      margin-bottom: 20px;
    }

    .profile-header {
      text-align: center;
    }

    .avatar {
      width: 130px;
      height: 130px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      background: #ffffff12;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      font-weight: bold;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .role {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 14px;
      border-radius: 20px;
      background: #ffffff12;
      color: #ddd;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.1;
    }

    h2 {
      margin-top: 0;
    }

    .muted {
      color: #aaa;
    }

    .location {
      margin-top: 12px;
      color: #bbb;
    }

    .bio {
      color: #ccc;
      white-space: pre-wrap;
    }

    .website {
      color: #fff;
      word-break: break-word;
    }

    .website a {
      color: #fff;
    }

    .status {
      padding: 16px;
      border-radius: 12px;
      background: #ffffff0d;
      color: #aaa;
      text-align: center;
    }

    .error {
      color: #ffb0b0;
      background: rgba(220, 70, 70, .12);
    }

    .back {
      display: inline-block;
      margin-top: 5px;
      padding: 11px 20px;
      border-radius: 25px;
      background: #fff;
      color: #080812;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      header {
        flex-direction: column;
      }

      main {
        width: min(100% - 24px, 850px);
        margin-top: 30px;
      }

      .panel {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html">
    ⭐ StarRise
  </a>

  <nav>
    <a href="services.html">
      Services
    </a>

    <a href="members.html">
      Members
    </a>

    <a href="dashboard.html">
      Dashboard
    </a>
  </nav>

</header>

<main>

  <section
    id="profile"
    class="panel"
  >

    <div class="status">
      Loading profile...
    </div>

  </section>

  <a
    class="back"
    href="members.html"
  >
    ← Back to Members
  </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const starRiseSupabase =
  window.supabase.createClient(
    'https://rcnikxotdalxtuvpmlvm.supabase.co',
    'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN'
  );


const profileContainer =
  document.getElementById('profile');


function escapeHtml(value) {

  return String(value ?? '')

    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

}


function getProfileId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get('id');

}


async function loadProfile() {

  const profileId =
    getProfileId();


  if (!profileId) {

    profileContainer.innerHTML = `
      <div class="status error">
        Profile not found.
      </div>
    `;

    return;

  }


  const {
    data: profile,
    error
  } =
    await starRiseSupabase

      .from('public_profiles')

      .select(`
        id,
        display_name,
        role,
        location,
        bio,
        website,
        avatar_url
      `)

      .eq(
        'id',
        profileId
      )

      .maybeSingle();


  if (error) {

    console.error(
      'Profile error:',
      error
    );

    profileContainer.innerHTML = `
      <div class="status error">
        We could not load this profile.
      </div>
    `;

    return;

  }


  if (!profile) {

    profileContainer.innerHTML = `
      <div class="status">
        This profile is not publicly available.
      </div>
    `;

    return;

  }


  const displayName =
    profile.display_name ||
    'StarRise Member';


  const initial =
    displayName
      .charAt(0)
      .toUpperCase();


  const avatarHtml =
    profile.avatar_url
      ? `
        <img
          src="${escapeHtml(profile.avatar_url)}"
          alt="${escapeHtml(displayName)}"
        >
      `
      : escapeHtml(initial);


  profileContainer.innerHTML = `

    <div class="profile-header">

      <div class="avatar">
        ${avatarHtml}
      </div>

      <h1>
        ${escapeHtml(displayName)}
      </h1>

      <div class="role">
        ${escapeHtml(
          profile.role ||
          'StarRise Member'
        )}
      </div>

      ${
        profile.location
          ? `
            <div class="location">
              📍 ${escapeHtml(profile.location)}
            </div>
          `
          : ''
      }

    </div>

  `;


  const details =
    document.createElement('section');

  details.className =
    'panel';


  details.innerHTML = `

    <h2>
      About
    </h2>

    <p class="bio">
      ${escapeHtml(
        profile.bio ||
        'This member has not added a bio yet.'
      )}
    </p>

    ${
      profile.website
        ? `
          <div class="website">
            <strong>Website:</strong>
            <a
              href="${escapeHtml(profile.website)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(profile.website)}
            </a>
          </div>
        `
        : ''
    }

  `;


  profileContainer.after(details);

}


loadProfile();

</script>

</body>

</html>
