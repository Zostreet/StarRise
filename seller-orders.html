
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarRise Seller Orders</title>
<style>
body {
  background:#10131d;
  color:white;
  font:16px system-ui;
  max-width:800px;
  margin:25px auto;
  padding:16px;
}
a {color:#ffd75e}
button {
  background:#ffd75e;
  border:0;
  border-radius:8px;
  padding:12px;
  font-weight:bold;
  margin:6px 0;
}
input {
  padding:10px;
  max-width:100%;
  box-sizing:border-box;
}
article {
  background:#22283a;
  padding:18px;
  border-radius:12px;
  margin:16px 0;
}
</style>
</head>
<body>

<h1>Seller Order Management</h1>
<p>Shipping management preview. Live checkout and payouts remain disabled.</p>

<p>
<a href="dashboard.html">Dashboard</a> |
<a href="seller-earnings.html">Seller Earnings</a>
</p>

<button id="refresh">Refresh My Orders</button>
<p id="status">Loading your orders...</p>
<div id="orders"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="css/payments.js?v=20261010-2"></script>

<script>
const db = window.StarRisePayments.client();
const out = document.getElementById("orders");
const status = document.getElementById("status");

const money = n =>
  "$" + (Number(n || 0) / 100).toFixed(2);

async function call(body) {
  const { data, error } = await db.functions.invoke(
    "starrise-seller-physical-orders",
    { body }
  );

  if (error) {
    let message = error.message;
    try {
      message =
        (await error.context.clone().json()).error ||
        message;
    } catch {}
    throw Error(message);
  }
  return data;
}

function paragraph(parent, content) {
  const element = document.createElement("p");
  element.textContent = content;
  parent.append(element);
}

async function refresh() {
  status.textContent = "Loading...";
  out.replaceChildren();

  try {
    const data = await call({ action: "list" });
    status.textContent =
      "Seller orders loaded. Live checkout remains disabled.";

    if (!data.orders.length) {
      paragraph(out, "No orders for this seller account.");
      return;
    }

    for (const order of data.orders) {
      const box = document.createElement("article");

      paragraph(box, "Order: " + order.id);
      paragraph(
        box,
        "Amount: " + money(order.amount_cents) +
        " | Payment: " + order.payment_status +
        " | Refund: " + (order.refund_status || "none")
      );

      const shipping = order.shipping;

      if (shipping) {
        paragraph(
          box,
          "Shipping: " + shipping.fulfillment_status +
          " | " + shipping.city +
          ", " + shipping.region +
          " " + shipping.postal_code
        );

        if (shipping.carrier) {
          paragraph(
            box,
            "Carrier: " + shipping.carrier +
            " | Tracking: " + (shipping.tracking_number || "")
          );
        }

        const eligible =
          order.payment_status === "paid" &&
          (!order.refund_status ||
           order.refund_status === "none");

        if (
          eligible &&
          shipping.fulfillment_status === "processing"
        ) {
          const carrier = document.createElement("input");
          carrier.placeholder = "Carrier";

          const tracking = document.createElement("input");
          tracking.placeholder = "Tracking number";

          const button = document.createElement("button");
          button.textContent = "Mark Shipped";

          button.onclick = async () => {
            if (!confirm("Confirm this shipment?")) return;
            button.disabled = true;

            try {
              await call({
                action: "update",
                order_id: order.id,
                status: "shipped",
                carrier: carrier.value,
                tracking_number: tracking.value
              });
              await refresh();
            } catch (error) {
              status.textContent = error.message;
              button.disabled = false;
            }
          };

          box.append(carrier, tracking, button);
        }

        if (
          eligible &&
          shipping.fulfillment_status === "shipped"
        ) {
          const button = document.createElement("button");
          button.textContent = "Mark Delivered";

          button.onclick = async () => {
            if (!confirm("Confirm delivery?")) return;
            button.disabled = true;

            try {
              await call({
                action: "update",
                order_id: order.id,
                status: "delivered"
              });
              await refresh();
            } catch (error) {
              status.textContent = error.message;
              button.disabled = false;
            }
          };

          box.append(button);
        }
      } else {
        paragraph(
          box,
          "No physical shipping record attached. " +
          "No shipping action available."
        );
      }

      out.append(box);
    }

  } catch (error) {
    status.textContent =
      "Could not load orders: " + error.message;
  }
}

document.getElementById("refresh").onclick = refresh;
refresh();
</script>
</body>
</html>
