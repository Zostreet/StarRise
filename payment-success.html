<html lang="en">
<head>

  </style></head><body><header>
  <a href="index.html">⭐ StarRise</a>
  <a href="dashboard.html">Dashboard</a>
</header><main>  <section class="card"><div class="icon">✓</div>

<h1>
  Payment complete
</h1>

<p class="muted">
  We're confirming your StarRise order with Stripe.
</p>

<div
  id="status"
  class="status"
>
  Verifying payment...
</div>

<div
  id="details"
  class="details hidden"
>

  <div class="row">
    <span class="label">
      Order
    </span>

    <span
      id="order-id"
      class="value"
    ></span>
  </div>

  <div class="row">
    <span class="label">
      Amount
    </span>

    <span
      id="amount"
      class="value"
    ></span>
  </div>

  <div class="row">
    <span class="label">
      Payment
    </span>

    <span
      id="payment-status"
      class="value"
    >
      Paid
    </span>
  </div>

  <div class="row">
    <span class="label">
      Order Status
    </span>

    <span
      id="order-status"
      class="value"
    ></span>
  </div>

</div>

<div class="buttons">

  <a
    class="button"
    href="dashboard.html"
  >
    Go to Dashboard
  </a>

  <a
    class="button secondary"
    href="services.html"
  >
    Browse Services
  </a>

</div>

  </section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const supabase =
  window.supabase.createClient(
    'https://rcnikxotdalxtuvpmlvm.supabase.co',
    'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN'
  );


const statusEl =
  document.getElementById(
    'status'
  );


const detailsEl =
  document.getElementById(
    'details'
  );


function showError(message) {

  statusEl.textContent =
    message;

  statusEl.className =
    'status error';

}


function showSuccess(message) {

  statusEl.textContent =
    message;

  statusEl.className =
    'status success';

}


async function finishPayment() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const sessionId =
    params.get(
      'session_id'
    );


  if (!sessionId) {

    showError(
      'The Stripe checkout session is missing. Please return to your dashboard and check My Orders.'
    );

    return;

  }


  const {
    data: sessionData,
    error: sessionError
  } =
    await supabase.auth.getSession();


  if (
    sessionError ||
    !sessionData ||
    !sessionData.session
  ) {

    showError(
      'Your StarRise sign-in session expired. Sign in again to view this order.'
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabase.functions.invoke(
      'complete-checkout',
      {
        body: {
          session_id:
            sessionId
        }
      }
    );


  if (error) {

    console.error(
      'Complete checkout error:',
      error
    );

    showError(
      error.message ||
      'We could not confirm this payment.'
    );

    return;

  }


  if (
    !data ||
    !data.success ||
    !data.order
  ) {

    showError(
      data?.error ||
      'The payment was received, but the StarRise order could not be confirmed.'
    );

    return;

  }


  const order =
    data.order;


  const amount =
    (
      Number(
        order.amount_cents ||
        0
      ) / 100
    ).toLocaleString(
      'en-US',
      {
        style: 'currency',
        currency: 'USD'
      }
    );


  document.getElementById(
    'order-id'
  ).textContent =
    order.id;


  document.getElementById(
    'amount'
  ).textContent =
    amount;


  document.getElementById(
    'payment-status'
  ).textContent =
    order.payment_status ||
    'paid';


  document.getElementById(
    'order-status'
  ).textContent =
    order.status ||
    'pending';


  detailsEl.classList.remove(
    'hidden'
  );


  showSuccess(
    'Your payment has been confirmed and your StarRise order is recorded.'
  );


  window.history.replaceState(
    {},
    document.title,
    'payment-success.html'
  );

}


finishPayment();

</script></body>
</html>
