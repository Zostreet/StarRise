
name: Fix StarRise Audio Timeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-timeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StarRise
        uses: actions/checkout@v4

      - name: Move audio timeline into mixer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("studio.html")
          html = path.read_text(encoding="utf-8")

          timeline = (
              '<div id="arrangement" '
              'class="arrangement" '
              'aria-label="Track arrangement"></div>'
          )

          mixer = '<div id="mixerTracks"></div>'

          if html.count(timeline) != 1:
              raise SystemExit(
                  "Expected exactly one audio timeline."
              )

          if html.count(mixer) != 1:
              raise SystemExit(
                  "Expected exactly one mixer container."
              )

          html = html.replace(timeline, "", 1)

          panel = '''
          <!-- STARRISE_AUDIO_TIMELINE_IN_MIXER_V1 -->
          <div class="panel" id="srAudioTouchTimeline">
            <h3>Audio Clip Timeline</h3>
            <p class="note">
              Drag the purple audio clips left or right
              to move them in the song.
              Stop playback before editing.
              Use Undo Track Edit to reverse a move.
            </p>
            ''' + timeline + '''
          </div>
          '''

          html = html.replace(
              mixer,
              panel + "\n" + mixer,
              1
          )

          path.write_text(html, encoding="utf-8")

          print("Audio timeline moved into Mixer & FX.")
          PY

      - name: Commit studio fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add studio.html

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix StarRise audio timeline placement"
            git push
          fi
