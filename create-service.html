<!doctype html>

<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">  <title>Create Service | StarRise</title>  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080812;
      color: #fff;
      line-height: 1.6;
    }

    header {
      padding: 20px 8%;
      border-bottom: 1px solid #ffffff18;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav a {
      margin-left: 20px;
    }

    main {
      width: min(700px, calc(100% - 40px));
      margin: 50px auto;
    }

    .panel {
      padding: 30px;
      border-radius: 20px;
      border: 1px solid #ffffff18;
      background: #ffffff08;
    }

    h1 {
      margin-top: 0;
    }

    .muted {
      color: #aaa;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ffffff25;
      background: #11111d;
      color: #fff;
      font-size: 16px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .hint {
      margin-top: 6px;
      color: #888;
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 30px;
      background: #fff;
      color: #080812;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #ffffff12;
    }

    #message.show {
      display: block;
    }

    #message.error {
      background: rgba(220,70,70,.15);
      color: #ffb0b0;
    }

    #message.success {
      background: rgba(50,180,100,.15);
      color: #a8ffc8;
    }

    .back {
      margin-top: 20px;
      text-align: center;
    }

    .back a {
      color: #fff;
    }

    @media (max-width: 650px) {

      header {
        flex-direction: column;
      }

      nav a {
        margin: 0 7px;
      }

      main {
        width: min(100% - 24px, 700px);
        margin-top: 30px;
      }

      .panel {
        padding: 22px;
      }

    }

  </style></head><body><header>  <a href="dashboard.html">
    ← StarRise Dashboard
  </a>  <nav><a href="services.html">
  Services
</a>

<a href="members.html">
  Members
</a>

  </nav></header><main>  <section class="panel"><h1>
  Create a Service
</h1>

<p class="muted">
  Offer your talent, skills, or professional
  services to clients through StarRise.
</p>


<div id="message"></div>


<form id="serviceForm">


  <div class="field">

    <label for="title">
      Service Name
    </label>

    <input
      id="title"
      type="text"
      maxlength="120"
      placeholder="Example: Professional Vocal Recording"
      required
    >

  </div>


  <div class="field">

    <label for="category">
      Category
    </label>

    <select
      id="category"
      required
    >

      <option value="Music">
        Music
      </option>

      <option value="Performance">
        Performance
      </option>

      <option value="Production">
        Production
      </option>

      <option value="Design">
        Design
      </option>

      <option value="Video">
        Video
      </option>

      <option value="Photography">
        Photography
      </option>

      <option value="Events">
        Events
      </option>

      <option value="Marketing">
        Marketing
      </option>

      <option value="Consulting">
        Consulting
      </option>

      <option value="Other">
        Other
      </option>

    </select>

  </div>


  <div class="field">

    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      maxlength="2000"
      placeholder="Describe exactly what the client receives..."
      required
    ></textarea>

    <div class="hint">
      Maximum 2,000 characters.
    </div>

  </div>


  <div class="field">

    <label for="price">
      Starting Price (USD)
    </label>

    <input
      id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="100.00"
      required
    >

    <div class="hint">
      Enter the starting price clients will see.
    </div>

  </div>


  <button
    id="publishButton"
    type="submit"
  >
    Publish Service
  </button>


</form>


<div class="back">

  <a href="dashboard.html">
    Return to Dashboard
  </a>

</div>

  </section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const starRiseSupabase =
  window.supabase.createClient(
    'https://rcnikxotdalxtuvpmlvm.supabase.co',
    'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN'
  );


const form =
  document.getElementById(
    'serviceForm'
  );


const publishButton =
  document.getElementById(
    'publishButton'
  );


const message =
  document.getElementById(
    'message'
  );


function showMessage(
  text,
  type = ''
) {

  message.textContent =
    text;

  message.className =
    'show ' + type;

}


async function checkSession() {

  const {
    data,
    error
  } =
    await starRiseSupabase
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.replace(
      'login.html'
    );

    return null;

  }


  return data.session.user;

}


form.addEventListener(
  'submit',
  async event => {

    event.preventDefault();


    const user =
      await checkSession();


    if (!user) {
      return;
    }


    const title =
      document.getElementById(
        'title'
      ).value.trim();


    const description =
      document.getElementById(
        'description'
      ).value.trim();


    const category =
      document.getElementById(
        'category'
      ).value;


    const price =
      Number(
        document.getElementById(
          'price'
        ).value
      );


    if (
      title.length < 3
    ) {

      showMessage(
        'Service name must be at least 3 characters.',
        'error'
      );

      return;

    }


    if (
      !description
    ) {

      showMessage(
        'Please describe your service.',
        'error'
      );

      return;

    }


    if (
      !Number.isFinite(price) ||
      price < 0
    ) {

      showMessage(
        'Please enter a valid price.',
        'error'
      );

      return;

    }


    const priceCents =
      Math.round(
        price * 100
      );


    publishButton.disabled =
      true;

    publishButton.textContent =
      'Publishing...';


    try {

      const {
        error
      } =
        await starRiseSupabase

          .from(
            'star_rise_services'
          )

          .insert({

            user_id:
              user.id,

            title:
              title,

            description:
              description,

            category:
              category,

            price_cents:
              priceCents,

            is_active:
              true

          });


      if (error) {
        throw error;
      }


      showMessage(
        'Your service is now live on StarRise.',
        'success'
      );


      form.reset();


      setTimeout(
        () => {

          location.replace(
            'services.html'
          );

        },
        1000
      );


    } catch (error) {

      console.error(
        'Service creation error:',
        error
      );


      showMessage(
        error.message ||
        'We could not publish your service.',
        'error'
      );


    } finally {

      publishButton.disabled =
        false;

      publishButton.textContent =
        'Publish Service';

    }

  }
);

</script></body></html>
