</style></head><body><header class="top"><div class="top-inner"><a class="brand" href="index.html">⭐ StarRise Admin</a><a href="founding-creator-admin.html">Review Center</a></div></header><main><div class="eyebrow">Private evaluation</div><h1>Founding Creator Scorecards</h1><p class="lead">Use consistent 1–5 ratings and private notes to support fair Wave One decisions.</p><div id="auth" class="status">Verifying administrator access…</div><section id="area" class="hidden"><div class="toolbar"><input id="search" type="search" placeholder="Search applicant, role, discipline, city…"></div><div id="list" class="list"></div></section></main><script>
const db=window.supabase.createClient("https://rcnikxotdalxtuvpmlvm.supabase.co","sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN"),auth=document.getElementById("auth"),area=document.getElementById("area"),list=document.getElementById("list"),search=document.getElementById("search");let user,applications=[],scorecards={};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const scoreOptions=v=>'<option value="">Not scored</option>'+[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(v)===n?"selected":""}>${n}</option>`).join("");const recommendationOptions=v=>[["","Not selected"],["strong_yes","Strong yes"],["yes","Yes"],["hold","Hold"],["no","No"],["strong_no","Strong no"]].map(([x,t])=>`<option value="${x}" ${v===x?"selected":""}>${t}</option>`).join("");function avg(s){const vals=[s.talent_score,s.mission_fit_score,s.readiness_score,s.collaboration_score].map(Number).filter(Boolean);return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):"—"}function render(){const term=search.value.trim().toLowerCase(),rows=applications.filter(a=>[a.legal_name,a.stage_or_business_name,a.applicant_role,a.genre_or_discipline,a.city].join(" ").toLowerCase().includes(term));if(!rows.length){list.innerHTML='<div class="empty">No applications match this search.</div>';return}list.innerHTML=rows.map(a=>{const s=scorecards[a.id]||{};return`<article class="card" data-id="${a.id}"><div class="head"><h2>${esc(a.stage_or_business_name||a.legal_name)}</h2><div class="meta">${esc(a.legal_name)} · ${esc(a.applicant_role)} · ${esc(a.city)} · Status: ${esc(a.status)}</div></div><div class="body"><div class="context"><div class="field"><span class="label">Discipline</span><div class="value">${esc(a.genre_or_discipline)}</div></div><div class="field"><span class="label">Availability</span><div class="value">${esc(a.showcase_availability)}</div></div><div class="field"><span class="label">Bio</span><div class="value">${esc(a.short_bio)}</div></div><div class="field"><span class="label">Support requested</span><div class="value">${esc(a.support_needed)}</div></div></div><div class="scores"><div><label>Talent / quality</label><select data-field="talent_score">${scoreOptions(s.talent_score)}</select></div><div><label>Mission fit</label><select data-field="mission_fit_score">${scoreOptions(s.mission_fit_score)}</select></div><div><label>Readiness</label><select data-field="readiness_score">${scoreOptions(s.readiness_score)}</select></div><div><label>Collaboration</label><select data-field="collaboration_score">${scoreOptions(s.collaboration_score)}</select></div></div><div class="wide"><div><label>Recommendation</label><select data-field="recommendation">${recommendationOptions(s.recommendation)}</select></div><div><label>Private admin notes</label><textarea data-field="admin_notes" maxlength="4000">${esc(s.admin_notes||"")}</textarea></div></div><div class="actions"><button class="save" type="button">Save Scorecard</button><span class="average">Average: <b>${avg(s)}</b>/5</span><span class="message"></span></div></div></article>`}).join("")}
async function load(){const[a,s]=await Promise.all([db.from("founding_creator_applications").select("id,legal_name,stage_or_business_name,applicant_role,genre_or_discipline,city,short_bio,support_needed,showcase_availability,status,created_at").order("created_at",{ascending:false}),db.from("founding_creator_scorecards").select("*")]);if(a.error||s.error){auth.textContent="Scorecards could not be loaded.";auth.className="status bad";return}applications=a.data||[];scorecards=Object.fromEntries((s.data||[]).map(x=>[x.application_id,x]));render()}
(async()=>{const{data:{session}}=await db.auth.getSession();if(!session){location.href="login.html?redirect=founding-creator-scorecards.html";return}user=session.user;const{data:admin}=await db.from("platform_admins").select("access_level").eq("user_id",user.id).maybeSingle();if(!admin){auth.textContent="Access denied. This page is limited to StarRise administrators.";auth.className="status bad";return}auth.textContent="Administrator access confirmed: "+admin.access_level+".";auth.className="status good";area.classList.remove("hidden");await load()})();search.addEventListener("input",render);list.addEventListener("change",e=>{const card=e.target.closest(".card");if(!card||!e.target.dataset.field)return;const s=scorecards[card.dataset.id]||{};s[e.target.dataset.field]=e.target.value||null;scorecards[card.dataset.id]=s;card.querySelector(".average b").textContent=avg(s)});list.addEventListener("input",e=>{const card=e.target.closest(".card");if(!card||e.target.dataset.field!=="admin_notes")return;const s=scorecards[card.dataset.id]||{};s.admin_notes=e.target.value;scorecards[card.dataset.id]=s});list.addEventListener("click",async e=>{if(!e.target.classList.contains("save"))return;const card=e.target.closest(".card"),id=card.dataset.id,s=scorecards[id]||{},msg=card.querySelector(".message"),button=e.target;button.disabled=true;button.textContent="Saving…";const record={application_id:id,talent_score:s.talent_score?Number(s.talent_score):null,mission_fit_score:s.mission_fit_score?Number(s.mission_fit_score):null,readiness_score:s.readiness_score?Number(s.readiness_score):null,collaboration_score:s.collaboration_score?Number(s.collaboration_score):null,recommendation:s.recommendation||null,admin_notes:s.admin_notes?.trim()||null,updated_by:user.id,updated_at:new Date().toISOString()};const{data,error}=await db.from("founding_creator_scorecards").upsert(record,{onConflict:"application_id"}).select().single();msg.textContent=error?error.message:"Scorecard saved.";msg.style.color=error?"#9d2639":"#176b45";if(!error)scorecards[id]=data;button.disabled=false;button.textContent="Save Scorecard"});
</script></body></html>
