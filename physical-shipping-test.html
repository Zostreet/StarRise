
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarRise Shipping Safety Tests</title>
<style>
body {
  background:#10131d;
  color:white;
  font:16px system-ui;
  max-width:650px;
  margin:20px auto;
  padding:18px;
}
button {
  padding:16px;
  background:#ffdb65;
  border:0;
  border-radius:9px;
  font-weight:bold;
  font-size:17px;
}
button:disabled {opacity:.6}
pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#242b3b;
  padding:20px;
  border-radius:10px;
}
a {color:#ffdb65}
</style>
</head>
<body>

<h1>StarRise Shipping Safety Tests</h1>
<p>Four Sandbox preview tests. No orders or payments.</p>

<button id="run">Run All 4 Tests</button>
<pre id="result">Ready.</pre>

<a href="create-physical-product.html">
Back to Physical Product Form
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="css/payments.js?v=20261010-2"></script>
<script>
const db = window.StarRisePayments.client();
const button = document.getElementById("run");
const output = document.getElementById("result");

const ITEM = "71127b13-1237-4934-bb50-20228f56d956";

async function quote(body) {
  const {data,error} = await db.functions.invoke(
    "starrise-physical-shipping-quote",
    {body}
  );

  if (error) {
    try {
      const response = await error.context.clone().json();
      return {error:response.error || error.message};
    } catch {
      return {error:error.message};
    }
  }

  return data;
}

button.onclick = async () => {
  button.disabled = true;
  let passed = 0;
  const lines = [];

  async function test(name,body,check) {
    try {
      const data = await quote(body);
      const ok = check(data);
      if (ok) passed++;
      lines.push(
        (ok ? "PASS" : "FAIL") +
        " - " + name + "\n" +
        JSON.stringify(data,null,2)
      );
    } catch (e) {
      lines.push("FAIL - " + name + ": " + e.message);
    }
    output.textContent = lines.join("\n\n");
  }

  await test(
    "Valid $25 shipping quote",
    {item_id:ITEM,quantity:1},
    d => d?.total_cents === 2500 &&
      d?.platform_fee_cents === 200 &&
      d?.payment_enabled === false &&
      d?.order_created === false
  );

  await test(
    "Reject 2 items when only 1 is in stock",
    {item_id:ITEM,quantity:2},
    d => d?.error === "Insufficient stock"
  );

  await test(
    "Reject zero quantity",
    {item_id:ITEM,quantity:0},
    d => Boolean(d?.error?.includes("Quantity"))
  );

  await test(
    "Reject invalid product ID",
    {item_id:"invalid",quantity:1},
    d => Boolean(d?.error?.includes("item ID"))
  );

  output.textContent =
    passed + " / 4 TESTS PASSED\n\n" +
    lines.join("\n\n");

  button.disabled = false;
};
</script>
</body>
</html>
