<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Services | StarRise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080812;
      color: #fff;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid #ffffff18;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
    }

    main {
      width: min(1100px, calc(100% - 40px));
      margin: 50px auto;
    }

    .hero {
      padding: 30px;
      border-radius: 20px;
      border: 1px solid #ffffff18;
      background: #ffffff08;
      margin-bottom: 25px;
    }

    .hero p {
      color: #aaa;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.1;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(280px, 1fr)
      );
      gap: 20px;
    }

    .service-card {
      border: 1px solid #ffffff18;
      border-radius: 20px;
      background: #ffffff08;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .category {
      color: #aaa;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .service-card h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .description {
      color: #ccc;
      white-space: pre-wrap;
      margin-bottom: 20px;
      flex: 1;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .provider {
      color: #aaa;
      margin-bottom: 18px;
    }

    .view-button {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      background: #fff;
      color: #080812;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    .status {
      padding: 18px;
      border-radius: 14px;
      background: #ffffff08;
      border: 1px solid #ffffff18;
      color: #aaa;
      text-align: center;
    }

    .error {
      color: #ffb0b0;
      background: rgba(220, 70, 70, .12);
    }

    .empty {
      padding: 30px;
      border-radius: 20px;
      border: 1px solid #ffffff18;
      background: #ffffff08;
      text-align: center;
      color: #aaa;
    }

    @media (max-width: 650px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      main {
        width: min(100% - 24px, 1100px);
        margin-top: 30px;
      }

      .hero {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html">
    ⭐ StarRise
  </a>

  <nav>

    <a href="services.html">
      Services
    </a>

    <a href="members.html">
      Members
    </a>

    <a href="dashboard.html">
      Dashboard
    </a>

  </nav>

</header>

<main>

  <section class="hero">

    <h1>StarRise Services</h1>

    <p>
      Discover services offered by StarRise members.
    </p>

  </section>

  <div
    id="status"
    class="status"
  >
    Loading services...
  </div>

  <section
    id="services"
    class="services-grid"
    style="display:none;"
  ></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const starRiseSupabase =
  window.supabase.createClient(
    'https://rcnikxotdalxtuvpmlvm.supabase.co',
    'sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN'
  );


const statusElement =
  document.getElementById('status');


const servicesElement =
  document.getElementById('services');


function escapeHtml(value) {

  return String(value ?? '')

    .replaceAll('&', '&amp;')

    .replaceAll('<', '&lt;')

    .replaceAll('>', '&gt;')

    .replaceAll('"', '&quot;')

    .replaceAll("'", '&#039;');

}


async function loadServices() {

  statusElement.textContent =
    'Loading services...';

  statusElement.className =
    'status';


  const {
    data: services,
    error
  } =
    await starRiseSupabase

      .from('star_rise_services')

      .select(`
        id,
        user_id,
        title,
        description,
        category,
        price_cents,
        is_active,
        created_at
      `)

      .eq(
        'is_active',
        true
      )

      .order(
        'created_at',
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      'Services error:',
      error
    );

    statusElement.textContent =
      'Unable to load services.';

    statusElement.className =
      'status error';

    return;

  }


  if (
    !services ||
    services.length === 0
  ) {

    statusElement.textContent =
      '';

    statusElement.className =
      '';

    statusElement.innerHTML = `
      <div class="empty">
        <h2>No services available yet</h2>
        <p>
          StarRise members have not published any
          services yet.
        </p>
      </div>
    `;

    return;

  }


  const providerIds =
    [
      ...new Set(
        services.map(
          service =>
            service.user_id
        )
      )
    ];


  const {
    data: profiles,
    error: profileError
  } =
    await starRiseSupabase

      .from('Profiles')

      .select(`
        id,
        display_name,
        full_name,
        location
      `)

      .in(
        'id',
        providerIds
      );


  if (profileError) {

    console.error(
      'Provider profile error:',
      profileError
    );

  }


  const profileMap =
    new Map(
      (profiles || []).map(
        profile => [
          profile.id,
          profile
        ]
      )
    );


  servicesElement.innerHTML =
    services.map(
      service => {

        const profile =
          profileMap.get(
            service.user_id
          );


        const providerName =
          profile?.display_name ||
          profile?.full_name ||
          'StarRise Member';


        const price =
          (
            Number(
              service.price_cents || 0
            ) / 100
          ).toLocaleString(
            'en-US',
            {
              style: 'currency',
              currency: 'USD'
            }
          );


        return `

          <article class="service-card">

            <div class="category">
              ${escapeHtml(
                service.category ||
                'Service'
              )}
            </div>

            <h2>
              ${escapeHtml(
                service.title ||
                'StarRise Service'
              )}
            </h2>

            <div class="description">
              ${escapeHtml(
                service.description ||
                'No description provided.'
              )}
            </div>

            <div class="price">
              ${price}
            </div>

            <div class="provider">
              Provided by
              <strong>
                ${escapeHtml(
                  providerName
                )}
              </strong>

              ${
                profile?.location
                  ? `
                    <br>
                    ${escapeHtml(
                      profile.location
                    )}
                  `
                  : ''
              }

            </div>

            <a
              class="view-button"
              href="service.html?id=${encodeURIComponent(
                service.id
              )}"
            >
              View Service
            </a>

          </article>

        `;

      }
    ).join('');


  statusElement.style.display =
    'none';

  servicesElement.style.display =
    'grid';

}


loadServices();

</script>

</body>

</html>
