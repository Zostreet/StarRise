<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase Complete | StarRise</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080812;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: min(700px, 100%);
      padding: 36px;
      border: 1px solid #ffffff18;
      border-radius: 24px;
      background: #ffffff08;
      text-align: center;
    }

    .check {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: rgba(50, 200, 100, .12);
    }

    h1 {
      font-size: clamp(36px, 7vw, 54px);
      margin: 0 0 12px;
    }

    p {
      color: #bbb;
      font-size: 18px;
      line-height: 1.6;
    }

    .reference {
      margin: 25px 0;
      padding: 15px;
      background: #ffffff08;
      border: 1px solid #ffffff18;
      border-radius: 14px;
      color: #aaa;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    a {
      padding: 12px 22px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background: white;
      color: #080812;
    }

    .secondary {
      color: white;
      border: 1px solid #ffffff30;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="check">✓</div>

  <h1>Checkout Complete</h1>

  <p>
    Stripe returned you to StarRise successfully.
    Your purchase is being finalized and should appear
    in your account once payment confirmation is processed.
  </p>

  <div id="reference" class="reference" hidden>
    Checkout reference:<br>
    <strong id="session"></strong>
  </div>

  <div class="buttons">
    <a class="primary" href="dashboard.html">
      View My Dashboard
    </a>

    <a class="secondary" href="marketplace.html">
      Back to Store
    </a>
  </div>

</div>

<script>
  const params =
    new URLSearchParams(window.location.search);

  const sessionId =
    params.get("session_id");

  if (sessionId) {
    document.getElementById("session").textContent =
      sessionId;

    document.getElementById("reference").hidden =
      false;
  }
</script>

</body>
</html>
