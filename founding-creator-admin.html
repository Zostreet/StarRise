<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Founding Creator Review | StarRise Admin</title><meta name="robots" content="noindex,nofollow"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}:root{--bg:#f5f2f9;--card:#fff;--ink:#181321;--muted:#6a6274;--purple:#4a217d;--purple2:#6d28d9;--gold:#e8a915;--line:#e4deea;--green:#157347;--red:#a12626;--blue:#225ea8}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#180d2f;color:#fff;position:sticky;top:0;z-index:5}.nav{max-width:1200px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{color:#fff;text-decoration:none;font-size:1.2rem;font-weight:900}.nav a{color:#efe8f8;text-decoration:none;font-weight:750}.wrap{max-width:1200px;margin:auto;padding:40px 20px 80px}.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--purple2);font-weight:900}.title-row h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1;margin:8px 0}.title-row p{color:var(--muted);margin:0}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:28px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px}.stat strong{display:block;font-size:1.8rem;color:var(--purple)}.stat span{font-size:.82rem;color:var(--muted);font-weight:750}.toolbar{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.toolbar input,.toolbar select{font:inherit;border:1px solid #cbc2d5;border-radius:10px;padding:11px 12px;background:#fff}.toolbar input{flex:1;min-width:220px}.status{padding:18px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:750}.status.bad{color:var(--red);border-color:#eccaca;background:#fff8f8}.status.good{color:var(--green)}.hidden{display:none!important}.list{display:grid;gap:18px}.app{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 25px rgba(38,19,59,.05)}.app-head{display:flex;justify-content:space-between;gap:20px;padding:20px;border-bottom:1px solid var(--line);background:#fcfbfd}.app-head h2{font-size:1.25rem;margin:0 0 5px;color:var(--purple)}.meta{color:var(--muted);font-size:.9rem}.badge{align-self:flex-start;border-radius:999px;padding:7px 11px;font-size:.76rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;background:#eee;color:#444}.badge.submitted{background:#efe5ff;color:#53218a}.badge.reviewing{background:#e1efff;color:#14518d}.badge.shortlisted{background:#fff0bf;color:#7b5200}.badge.accepted{background:#dff5e9;color:#12633e}.badge.declined{background:#fde3e3;color:#8f2020}.app-body{padding:20px}.contact{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}.contact a{color:var(--blue);font-weight:750}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{border-top:1px solid var(--line);padding-top:12px}.field.full{grid-column:1/-1}.label{display:block;color:var(--muted);font-size:.74rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}.value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.value a{color:var(--blue)}.checks{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{background:#f3f0f6;border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:750}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}.actions button{font:inherit;font-weight:850;border:1px solid #cfc5d7;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.actions button:hover{border-color:var(--purple2);color:var(--purple2)}.actions button.active{background:var(--purple);border-color:var(--purple);color:#fff}.empty{text-align:center;padding:55px 20px;background:#fff;border:1px solid var(--line);border-radius:18px;color:var(--muted)}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:480px){.summary{grid-template-columns:1fr 1fr}.app-head{flex-direction:column}.wrap{padding-top:28px}}
</style></head><body><header><div class="nav"><a class="logo" href="index.html">⭐ StarRise Admin</a><nav><a href="dashboard.html">Member Dashboard</a></nav></div></header>
<main class="wrap"><div class="title-row"><div><div class="eyebrow">Private review center</div><h1>Founding Creators</h1><p>Review Wave One applications and move candidates through selection.</p></div><button id="refresh" type="button" hidden>Refresh</button></div>
<div id="authStatus" class="status">Verifying administrator access…</div>
<section id="adminArea" class="hidden"><div class="summary"><div class="stat"><strong id="total">0</strong><span>Total</span></div><div class="stat"><strong id="submitted">0</strong><span>Submitted</span></div><div class="stat"><strong id="reviewing">0</strong><span>Reviewing</span></div><div class="stat"><strong id="shortlisted">0</strong><span>Shortlisted</span></div><div class="stat"><strong id="accepted">0</strong><span>Accepted</span></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search name, role, city, discipline…" aria-label="Search applications"><select id="filter" aria-label="Filter by status"><option value="all">All statuses</option><option value="submitted">Submitted</option><option value="reviewing">Reviewing</option><option value="shortlisted">Shortlisted</option><option value="accepted">Accepted</option><option value="declined">Declined</option></select></div><div id="list" class="list"></div></section></main>
<script>
const SUPABASE_URL="https://rcnikxotdalxtuvpmlvm.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_VVprrzpACjd89clo0tFs4Q_VAKVL3GN",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const authStatus=document.getElementById("authStatus"),adminArea=document.getElementById("adminArea"),list=document.getElementById("list"),search=document.getElementById("search"),filter=document.getElementById("filter");let applications=[];
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
function summary(){for(const id of["submitted","reviewing","shortlisted","accepted"])document.getElementById(id).textContent=applications.filter(a=>a.status===id).length;document.getElementById("total").textContent=applications.length}
function render(){const term=search.value.trim().toLowerCase(),status=filter.value;const rows=applications.filter(a=>(status==="all"||a.status===status)&&[a.legal_name,a.stage_or_business_name,a.applicant_role,a.city,a.genre_or_discipline].join(" ").toLowerCase().includes(term));if(!rows.length){list.innerHTML='<div class="empty">No applications match this view.</div>';return}list.innerHTML=rows.map(a=>`<article class="app" data-id="${a.id}"><div class="app-head"><div><h2>${esc(a.stage_or_business_name||a.legal_name)}</h2><div class="meta">${esc(a.legal_name)} · ${esc(a.applicant_role.replaceAll("_"," "))} · ${esc(a.city)}<br>Submitted ${new Date(a.created_at).toLocaleString()}</div></div><span class="badge ${esc(a.status)}">${esc(a.status)}</span></div><div class="app-body"><div class="contact"><a href="mailto:${esc(a.email)}">${esc(a.email)}</a>${a.phone?`<a href="tel:${esc(a.phone)}">${esc(a.phone)}</a>`:""}</div><div class="grid"><div class="field"><span class="label">Discipline</span><div class="value">${esc(a.genre_or_discipline)}</div></div><div class="field"><span class="label">Availability</span><div class="value">${esc(a.showcase_availability)}</div></div><div class="field full"><span class="label">Bio</span><div class="value">${esc(a.short_bio)}</div></div><div class="field full"><span class="label">Work links</span><div class="value">${linkify(a.portfolio_links)}</div></div>${a.social_links?`<div class="field full"><span class="label">Social links</span><div class="value">${linkify(a.social_links)}</div></div>`:""}<div class="field full"><span class="label">Support requested</span><div class="value">${esc(a.support_needed)}</div></div>${a.offerings?`<div class="field full"><span class="label">Offerings</span><div class="value">${esc(a.offerings)}</div></div>`:""}</div><div class="checks"><span class="pill">Adult/guardian ✓</span><span class="pill">Standards ✓</span><span class="pill">Terms ✓</span><span class="pill">Payment notice ✓</span>${a.media_release_interest?'<span class="pill">Media interest ✓</span>':""}</div><div class="actions" aria-label="Update application status">${["submitted","reviewing","shortlisted","accepted","declined"].map(s=>`<button type="button" class="${a.status===s?"active":""}" data-status="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</div></div></article>`).join("")}
async function load(){const{data,error}=await db.from("founding_creator_applications").select("*").order("created_at",{ascending:false});if(error){authStatus.textContent="Applications could not be loaded: "+error.message;authStatus.className="status bad";return}applications=data||[];summary();render()}
async function start(){const{data:{session}}=await db.auth.getSession();if(!session){authStatus.innerHTML='Please <a href="login.html?redirect=founding-creator-admin.html">sign in</a> with a StarRise administrator account.';authStatus.className="status bad";return}const{data:admin,error}=await db.from("platform_admins").select("access_level").eq("user_id",session.user.id).maybeSingle();if(error||!admin){authStatus.textContent="Access denied. This page is limited to StarRise administrators.";authStatus.className="status bad";return}authStatus.textContent=`Administrator access confirmed: ${admin.access_level}.`;authStatus.className="status good";adminArea.classList.remove("hidden");await load()}
list.addEventListener("click",async e=>{const button=e.target.closest("button[data-status]");if(!button)return;const card=button.closest(".app"),id=card.dataset.id,status=button.dataset.status;button.disabled=true;const{error}=await db.from("founding_creator_applications").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert("Could not update application: "+error.message);button.disabled=false;return}const app=applications.find(a=>a.id===id);if(app)app.status=status;summary();render()});search.addEventListener("input",render);filter.addEventListener("change",render);start();
</script></body></html>
